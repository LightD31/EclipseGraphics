<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Premier vol A350F · Toulouse</title>
<style>
  :root {
    --red: #e1000f;
    --navy: #10173a;
    --navy-2: #1b2450;
    --blue: #2857c8;
    --white: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; }
  body {
    font-family: 'Univers Next', 'Univers Next Pro', 'UniversNext', 'Univers Next W1G', 'Arial Narrow', 'Helvetica Neue Condensed', 'Segoe UI', Arial, sans-serif;
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  #bar { width: 100%; display: flex; align-items: flex-end; }

  /* ===== Choreographed broadcast reveal (same timing as the eclipse bar) =====
     0.00s  red band wipes open left→right
     0.10s  map panel slides in from the left
     0.20s  headline text slides in
     0.35s  ticker band rises
     0.38s  timer fades up
     0.45s  aircraft marker pops with overshoot
     0.50s  light sheen sweeps across the red band
     0.55s  white strap rises
     0.60s+ ticker segments cascade in, then clock (and, fullscreen, the
            flight-data panel)
     0.85s  progress line grows from the left */
  .rv { overflow: hidden; }
  .rv > *, #planepop, #status, #cdwrap, .seg, #clock, #timeline, #telemetry {
    will-change: transform, opacity; backface-visibility: hidden;
  }
  /* Hidden base states (parked, before .on) */
  #redband { position: relative; overflow: hidden; clip-path: inset(0 100% 0 0); }
  #mappanel { transform: translate3d(-110%, 0, 0); }
  #planepop { transform: scale(0); }
  #strap, #ticker { transform: translate3d(0, 110%, 0); }
  #status, #cdwrap, .seg, #clock, #telemetry { opacity: 0; }
  #timeline { transform: scaleX(0); transform-origin: left center; }
  #redband::after {
    content: ''; position: absolute; top: 0; bottom: 0; width: 34%; left: 0;
    background: linear-gradient(105deg, transparent, rgba(255,255,255,0.28), transparent);
    transform: translateX(-300%) skewX(-15deg); pointer-events: none;
  }

  @keyframes kWipe  { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes kSlideL{ from { transform: translate3d(-110%,0,0); } to { transform: translate3d(0,0,0); } }
  @keyframes kRise  { from { transform: translate3d(0,110%,0); } to { transform: translate3d(0,0,0); } }
  @keyframes kPop   { 0% { transform: scale(0); } 70% { transform: scale(1.09); } 100% { transform: scale(1); } }
  @keyframes kText  { from { opacity: 0; transform: translate3d(-24px,0,0); } to { opacity: 1; transform: none; } }
  @keyframes kFadeUp{ from { opacity: 0; transform: translate3d(0,14px,0); } to { opacity: 1; transform: none; } }
  @keyframes kSheen { to { transform: translateX(340%) skewX(-15deg); } }
  @keyframes kGrowX { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  #bar.on #redband        { animation: kWipe  0.45s cubic-bezier(0.22,1,0.36,1) 0s     both; }
  #bar.on #mappanel       { animation: kSlideL 0.5s cubic-bezier(0.22,1,0.36,1) 0.1s   both; }
  #bar.on #status         { animation: kText  0.45s cubic-bezier(0.22,1,0.36,1) 0.2s   both; }
  #bar.on #ticker         { animation: kRise  0.5s  cubic-bezier(0.22,1,0.36,1) 0.35s  both; }
  #bar.on #cdwrap         { animation: kFadeUp 0.4s ease-out                    0.38s  both; }
  #bar.on #planepop       { animation: kPop   0.5s  cubic-bezier(0.34,1.56,0.64,1) 0.45s both; }
  #bar.on #redband::after { animation: kSheen 0.7s  ease                        0.5s   both; }
  #bar.on #strap          { animation: kRise  0.45s cubic-bezier(0.22,1,0.36,1) 0.55s  both; }
  #bar.on .seg            { animation: kText  0.35s ease-out both; }
  #bar.on .seg:nth-child(1) { animation-delay: 0.6s; }
  #bar.on .seg:nth-child(2) { animation-delay: 0.72s; }
  #bar.on .seg:nth-child(3) { animation-delay: 0.84s; }
  #bar.on .seg:nth-child(4) { animation-delay: 0.96s; }
  #bar.on #telemetry      { animation: kFadeUp 0.45s ease-out                   0.6s   both; }
  #bar.on #clock          { animation: kFadeUp 0.35s ease-out                   1.05s  both; }
  #bar.on #timeline       { animation: kGrowX 0.45s cubic-bezier(0.22,1,0.36,1) 0.85s  both; }

  /* ===== Reverse choreography (out, ~0.65s total) ===== */
  @keyframes kWipeOut  { from { clip-path: inset(0 0 0 0); } to { clip-path: inset(0 100% 0 0); } }
  @keyframes kSlideLOut{ from { transform: translate3d(0,0,0); } to { transform: translate3d(-110%,0,0); } }
  @keyframes kDrop     { from { transform: translate3d(0,0,0); } to { transform: translate3d(0,110%,0); } }
  @keyframes kTextOut  { from { opacity: 1; transform: none; } to { opacity: 0; transform: translate3d(-24px,0,0); } }
  @keyframes kFadeDown { from { opacity: 1; transform: none; } to { opacity: 0; transform: translate3d(0,14px,0); } }
  @keyframes kShrinkX  { from { transform: scaleX(1); } to { transform: scaleX(0); } }

  #bar.off #timeline  { animation: kShrinkX 0.25s ease-in 0s both; }
  #bar.off .seg       { animation: kTextOut 0.2s ease-in 0s both; }
  #bar.off #clock     { animation: kFadeDown 0.2s ease-in 0s both; }
  #bar.off #telemetry { animation: kFadeDown 0.25s ease-in 0s both; }
  #bar.off #cdwrap    { animation: kFadeDown 0.25s ease-in 0s both; }
  #bar.off #strap     { animation: kDrop 0.3s ease-in 0.05s both; }
  #bar.off #status    { animation: kTextOut 0.3s ease-in 0.08s both; }
  #bar.off #ticker    { animation: kDrop 0.35s ease-in 0.12s both; }
  #bar.off #redband   { animation: kWipeOut 0.4s cubic-bezier(0.5,0,0.75,0) 0.18s both; }
  #bar.off #mappanel  { animation: kSlideLOut 0.4s cubic-bezier(0.5,0,0.75,0) 0.22s both; }

  /* ===== Full-height map panel on the left =====
     The lower third's square is a live map following the aircraft; the
     fullscreen scene grows the very same map to the whole canvas. */
  .rv-map { flex: 0 0 202px; height: 202px; }
  #mappanel {
    position: relative; width: 100%; height: 100%;
    background: var(--navy); overflow: hidden;
  }
  #mapscene {
    position: absolute; inset: 0; overflow: hidden;
    background: var(--navy); isolation: isolate;
  }
  /* Basemap: the tiles are desaturated (and, for a light map such as the
     default OpenStreetMap one, inverted), then screened with the navy so the
     darks become the broadcast navy and roads/labels stay neutral.
     ?tilestyle=invert|tint|raw picks the treatment. */
  #tiles { position: absolute; inset: 0; overflow: hidden; }
  #tiles.invert { filter: grayscale(1) invert(1) brightness(0.72) contrast(1.35); }
  #tiles.tint { filter: grayscale(1) brightness(1.35) contrast(1.1); }
  #tint.raw { display: none; }
  .tl { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .tile {
    position: absolute; width: 256.5px; height: 256.5px;
    opacity: 0; transition: opacity 0.35s ease; user-select: none;
  }
  .tile.ok { opacity: 1; }
  #tint {
    position: absolute; inset: 0; pointer-events: none;
    background: var(--navy); mix-blend-mode: screen;
  }
  #mapsvg {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    overflow: visible; pointer-events: none;
  }
  #mapsvg text { font-family: inherit; }
  #homelbl { display: none; }
  #bar.fs:not(.swap) #homelbl { display: inline; }

  /* Aircraft marker: #planepos is moved every frame, #planepop carries the
     reveal pop, #planeicon turns with the track. */
  #planepos { position: absolute; left: 0; top: 0; will-change: transform; pointer-events: none; }
  #planepop { position: absolute; left: 0; top: 0; }
  #planeicon {
    position: absolute; width: 34px; height: 34px; left: -17px; top: -17px;
    filter: drop-shadow(0 0 5px rgba(225,0,15,0.9));
  }
  #planering {
    position: absolute; width: 56px; height: 56px; left: -28px; top: -28px;
    border: 3px solid var(--red); border-radius: 50%;
    animation: kPing 1.8s ease-out infinite;
  }
  @keyframes kPing { from { transform: scale(0.35); opacity: 0.95; } to { transform: scale(1.5); opacity: 0; } }
  #planetag {
    display: none; position: absolute; left: 44px; top: -16px;
    white-space: nowrap; font-size: 17px; font-weight: 900; line-height: 1;
  }
  #planetag span { padding: 6px 9px; }
  #planetag .r { background: var(--red); color: #fff; }
  #planetag #tagalt { background: #fff; color: #111; font-variant-numeric: tabular-nums; }
  #plane.nodata #planepos { display: none; }

  /* Map caption + legend (fullscreen, map on the canvas): top-left corner */
  #mapcap {
    display: none; position: absolute; left: 90px; top: 64px; color: #fff;
    text-shadow: 0 0 3px var(--navy), 0 0 7px var(--navy), 0 0 12px var(--navy);
  }
  #mapcap b { font-size: 18px; font-weight: 900; letter-spacing: 1px; }
  #mapcap .leg {
    display: flex; align-items: center; gap: 12px; margin-top: 16px;
    font-size: 16px; font-weight: 700;
  }
  #mapcap .leg i { display: inline-block; width: 40px; height: 6px; background: var(--red); box-shadow: 0 0 0 1.5px rgba(255,255,255,0.35); }
  #mapcap .leg i.lp { width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px var(--red); margin-left: 18px; }
  /* Card header, mirroring the flight-profile card's; only shown once swapped */
  #maphead {
    display: none; position: absolute; left: 0; right: 0; top: 0; z-index: 3;
    align-items: baseline; justify-content: space-between;
    padding: 10px 14px 4px; color: #fff; pointer-events: none;
    background: linear-gradient(rgba(8,12,36,0.92), rgba(8,12,36,0));
  }
  #maphead b { font-size: 17px; font-weight: 900; letter-spacing: 0.5px; }
  #maphead span { font-size: 15px; color: rgba(255,255,255,0.65); font-variant-numeric: tabular-nums; }
  /* Basemap + data credits: required, kept small */
  #attrib {
    position: absolute; right: 4px; bottom: 2px; z-index: 3;
    font-size: 9px; line-height: 1.2; color: rgba(255,255,255,0.6); white-space: nowrap;
    text-shadow: 0 0 3px #000; pointer-events: none;
  }

  #right { flex: 1 1 auto; min-width: 0; }

  /* ===== White info strap ===== */
  .rv-strap { width: fit-content; max-width: 85vw; }
  #strap {
    display: inline-flex; align-items: center; gap: 14px;
    height: 46px; background: var(--white); color: #111;
    padding: 0 22px; white-space: nowrap;
  }
  #strap b { font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums; }
  #strap b:empty { display: none; }
  #strap .blue { color: var(--blue); font-weight: 700; font-size: 19px; }
  #strap .info { font-size: 19px; color: #111; font-weight: 400; font-variant-numeric: tabular-nums; }
  #bar:not(.fs) #strap .fsid, #bar.fs #strap .lt { display: none; }
  #live {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 15px; font-weight: 900; letter-spacing: 1px;
    text-transform: uppercase; color: var(--red);
  }
  #live::before {
    content: ''; width: 10px; height: 10px; border-radius: 50%;
    background: currentColor; animation: kBlink 1.4s ease-in-out infinite;
  }
  #live.idle { color: #7d8396; }
  #live.idle::before { animation: none; }
  @keyframes kBlink { 50% { opacity: 0.25; } }

  /* ===== Big red headline band ===== */
  #redband {
    display: flex; align-items: center;
    height: 92px; background: var(--red); color: var(--white);
    padding: 0 34px;
  }
  #headline { min-width: 0; flex: 1 1 auto; }
  #status {
    font-size: 46px; font-weight: 900; line-height: 1.22;
    text-transform: uppercase; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
    letter-spacing: -0.5px;
    text-shadow: 0 2px 0 rgba(0,0,0,0.12);
    transition: none;
  }
  #cdwrap {
    margin-left: auto; padding-left: 30px;
    display: flex; align-items: baseline; gap: 16px; flex: 0 0 auto;
  }
  #cdlabel {
    font-size: 19px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; white-space: nowrap;
  }
  #countdown {
    font-size: 56px; font-weight: 900; line-height: 1;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }

  /* Flight-data panel: fullscreen only, under the red block */
  #telemetry { display: none; }

  /* ===== Navy ticker band ===== */
  #ticker {
    display: flex; align-items: center;
    height: 54px; background: var(--navy); color: var(--white);
    padding: 0 0 0 34px;
    font-size: 21px; white-space: nowrap; overflow: hidden;
  }
  .seg { display: flex; align-items: baseline; gap: 10px; padding-right: 34px; }
  .seg .lbl { font-weight: 900; text-transform: uppercase; }
  .seg .val { font-weight: 400; font-variant-numeric: tabular-nums; }
  .seg .sub { font-size: 17px; color: rgba(255,255,255,0.55); }
  .seg .sub:empty { display: none; }
  #clock {
    margin-left: auto; align-self: stretch;
    display: flex; align-items: center;
    background: var(--navy-2); padding: 0 26px;
    font-weight: 900; font-size: 24px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }

  /* Progress line: flight time against the planned duration, hour marks */
  #timeline { position: relative; height: 10px; background: var(--navy-2); }
  #progressFill { height: 100%; width: 0%; background: var(--red); }
  .mk { position: absolute; top: 0; width: 3px; height: 10px; background: var(--white); }

  /* ===== Fullscreen scene =====
     A dedicated full-canvas layout, not a morph of the lower third: the map
     fills the screen and the info blocks float on top. Like the eclipse sky
     scene it is framed like a camera: the aircraft and its track are held in
     whatever the overlay blocks leave free (left of the red column, above the
     ticker, clear of the corner card and the caption), and the map pans and
     zooms behind them. Requires the browser source to cover the full canvas
     (1920x1080). */
  #bar.fs { display: block; }
  #bar.fs .rv-map { position: absolute; inset: 0; flex: none; height: 100vh; }
  #bar.fs #mappanel { position: absolute; inset: 0; }
  #bar.fs #right { position: absolute; inset: 0; }
  #bar.fs:not(.swap) #mapcap { display: block; }
  #bar.fs:not(.swap) #planetag { display: flex; }
  #bar.fs #planeicon { width: 60px; height: 60px; left: -30px; top: -30px; }
  #bar.fs #planering { width: 96px; height: 96px; left: -48px; top: -48px; border-width: 4px; }
  #bar.fs:not(.swap) #attrib { right: calc(46vw + 14px); bottom: 100px; font-size: 13px; }

  /* Corner card: the flight profile (altitude and speed over time). */
  #profilecard {
    display: none; position: absolute;
    left: 0; bottom: 94px; width: 24vw;
    background: rgba(8,12,36,0.88);
    border: 1px solid rgba(255,255,255,0.22);
    flex-direction: column;
  }
  #bar.fs #profilecard { display: flex; animation: kFadeUp 0.5s ease-out 0.5s backwards; }
  #bar.fs.nocard:not(.swap) #profilecard { display: none; }
  #profhead {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 10px 14px 4px; color: #fff;
  }
  #profhead b { font-size: 17px; font-weight: 900; letter-spacing: 0.5px; }
  #profhead span { font-size: 15px; color: rgba(255,255,255,0.65); font-variant-numeric: tabular-nums; }
  #profsvg { display: block; width: 100%; height: 12vw; }
  #profsvg text { font-family: inherit; font-variant-numeric: tabular-nums; }

  /* ===== Swapped scene (main.profile) =====
     The profile takes the canvas and the map shrinks into the corner card
     the profile was in, at the same size, so the card doesn't jump. */
  #bar.fs.swap #profilecard {
    inset: 0; width: auto;
    background: transparent; border: none;
    animation: kFadeUp 0.55s ease-out 0.25s backwards;
  }
  #bar.fs.swap #profhead {
    justify-content: flex-start; gap: 22px;
    padding: 64px 0 0 90px;
  }
  #bar.fs.swap #profhead b { font-size: 22px; letter-spacing: 1px; }
  #bar.fs.swap #profhead span { font-size: 18px; }
  #bar.fs.swap #profsvg { flex: 1 1 auto; height: auto; min-height: 0; }
  #bar.fs.swap #mapscene {
    inset: auto; left: 0; bottom: 94px; width: 24vw; height: calc(12vw + 37px);
    z-index: 2;
    border: 1px solid rgba(255,255,255,0.22);
    animation: kFadeUp 0.5s ease-out 0.5s backwards;
  }
  #bar.fs.swap #maphead { display: flex; }
  #bar.fs.swap #planeicon { width: 26px; height: 26px; left: -13px; top: -13px; }
  #bar.fs.swap #planering { width: 40px; height: 40px; left: -20px; top: -20px; border-width: 2px; }
  #bar.fs.swap.nocard #mapscene { display: none; }

  /* White strap: top-right corner */
  #bar.fs .rv-strap { position: absolute; top: 0; right: 0; width: auto; max-width: none; }
  #bar.fs #strap { height: 64px; padding: 0 44px; gap: 18px; }
  #bar.fs #strap b { font-size: 30px; }
  #bar.fs #strap .blue { font-size: 23px; }
  #bar.fs #strap .info { font-size: 21px; }
  #bar.fs #live { font-size: 17px; }

  /* Right column: red block (headline + timer) and the flight-data panel */
  #bar.fs #rcol { position: absolute; top: 64px; right: 0; width: 46vw; }
  #bar.fs #redband {
    height: auto;
    flex-direction: column; align-items: flex-end; gap: 18px;
    padding: 30px 44px;
  }
  #bar.fs #headline { width: 100%; flex: 0 0 auto; }
  #bar.fs #status { text-align: right; }
  #bar.fs #cdwrap {
    margin: 0; padding: 0;
    flex-direction: column; align-items: flex-end; gap: 8px;
  }
  #bar.fs #cdlabel { font-size: 26px; }
  #bar.fs #countdown { font-size: 118px; }
  #bar.fs #telemetry {
    display: grid; grid-template-columns: repeat(3, 1fr);
    background: rgba(16,23,58,0.94); color: #fff;
  }
  .tm { padding: 18px 20px 20px 26px; border-top: 1px solid rgba(255,255,255,0.12); min-width: 0; }
  .tm + .tm { border-left: 1px solid rgba(255,255,255,0.12); }
  .tm:nth-child(4) { border-left: none; }
  .tm .k {
    font-size: 17px; font-weight: 900; letter-spacing: 1px;
    text-transform: uppercase; color: rgba(255,255,255,0.62); white-space: nowrap;
  }
  .tm .v {
    margin-top: 4px; font-size: 54px; font-weight: 900; line-height: 1.02;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .tm .v small { font-size: 22px; font-weight: 700; margin-left: 6px; color: rgba(255,255,255,0.72); }
  .tm .s {
    margin-top: 4px; font-size: 18px; color: rgba(255,255,255,0.55);
    font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* Ticker pinned to the bottom, timeline underneath */
  #bar.fs .rv-ticker { position: absolute; left: 0; right: 0; bottom: 18px; }
  #bar.fs #ticker { height: 76px; padding-left: 44px; font-size: 23px; }
  #bar.fs .seg { padding-right: 40px; }
  #bar.fs .seg .sub { font-size: 18px; }
  #bar.fs #clock { font-size: 32px; padding: 0 36px; }
  #bar.fs #timeline { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; }
  #bar.fs .mk { height: 18px; }

  /* ===== Native morph between the layouts (View Transitions API) ===== */
  #mappanel    { view-transition-name: vt-panel; }
  #mapscene    { view-transition-name: vt-map; }
  #profilecard { view-transition-name: vt-profile; }
  #strap       { view-transition-name: vt-strap; }
  #redband     { view-transition-name: vt-red; }
  #telemetry   { view-transition-name: vt-telemetry; }
  #ticker      { view-transition-name: vt-ticker; }
  #timeline    { view-transition-name: vt-timeline; }
  ::view-transition-group(*) {
    animation-duration: 0.65s;
    animation-timing-function: cubic-bezier(0.22,1,0.36,1);
  }
  ::view-transition-old(root), ::view-transition-new(root) {
    animation-duration: 0.65s;
  }
</style>
</head>
<body>
<div id="bar">
  <div class="rv rv-map">
  <div id="mappanel">
    <div id="mapscene">
      <div id="tiles"></div>
      <div id="tint"></div>
      <svg id="mapsvg" aria-hidden="true">
        <g id="trk">
          <g id="rwys" stroke="rgba(255,255,255,0.85)" stroke-width="3" stroke-linecap="round"></g>
          <polyline id="trkcase" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="9"
                    stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
          <polyline id="trkline" fill="none" stroke="#e1000f" stroke-width="5"
                    stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        </g>
        <line id="trkhead" stroke="#e1000f" stroke-width="5" stroke-linecap="round"/>
        <g id="homeg">
          <circle r="7" fill="#fff" stroke="#e1000f" stroke-width="3"/>
          <text id="homelbl" x="16" y="-12" font-size="17" font-weight="900" fill="#fff"
                stroke="#10173a" stroke-width="4" stroke-linejoin="round" paint-order="stroke">TOULOUSE-BLAGNAC</text>
        </g>
      </svg>
      <div id="plane" class="nodata">
        <div id="planepos"><div id="planepop">
          <div id="planering"></div>
          <svg id="planeicon" viewBox="0 0 100 100" aria-hidden="true">
            <g id="planeshape" fill="#fff" stroke="#10173a" stroke-width="2.4" stroke-linejoin="round">
              <path d="M46.5 41 L4 63 L4 68.5 L46.5 56 Z"/>
              <path d="M53.5 41 L96 63 L96 68.5 L53.5 56 Z"/>
              <rect x="25.5" y="44" width="7.5" height="13" rx="3.5"/>

<script>
/* Slide-in each time the source goes on air (Companion / OBS visibility
   toggle), and the command vocabulary Companion drives — the same machinery
   as eclipse-widget-broadcast.html, under its own event key and variable
   prefix so both overlays can share one OBS and one Companion. */
(function () {
  var bar = document.getElementById('bar');
  var animated = false;
  var q = new URLSearchParams(location.search);
  /* ?noautoanim — don't auto slide in/out when the OBS source's own
     visibility toggles; the bar then only reacts to explicit commands. */
  var AUTO_ANIM = !q.has('noautoanim');
  function playIn() {
    animated = true;
    bar.classList.remove('off');
    bar.classList.remove('on');
    void bar.offsetWidth; /* flush so the slide always starts off-screen */
    requestAnimationFrame(function () { bar.classList.add('on'); });
  }
  function reset() { bar.classList.remove('on'); }
  function playOut() {
    bar.classList.remove('on');
    bar.classList.add('off');
  }
  /* Morph between layouts: View Transitions API where available (Chromium
     111+ / modern OBS CEF), replaying the reveal otherwise. */
  function switchView(change) {
    if (document.startViewTransition) {
      document.startViewTransition(change);
    } else {
      change();
      playIn();
    }
  }

  /* ===== Command vocabulary =====
     Every command reads <property>.<value>, with .toggle on each; the values
     are the ones the matching Companion variable reports (a350f_layout, …),
     so a button's command and its feedback compare against the same word.
       air     on | off | toggle         on air, or parked off-screen
       layout  full | lower | toggle     which layout
       main    map | profile | toggle    which view owns the canvas (fullscreen)
       card    on | off | toggle         the corner card
       map     track | follow | toggle   frame the whole track, or ride with
                                         the aircraft (fullscreen map)
     air.on.full / air.on.lower land on air in a named layout in one step.
     Anything else (schedule, take-off, headline, mode, units, banners) is
     about the flight, not the view: it goes to the flight script below, with
     the event's other fields (a "text", for instance). */
  function isOn() { return bar.classList.contains('on'); }
  function isFs() { return bar.classList.contains('fs'); }
  function setState(name, want) {
    if (bar.classList.contains(name) === want) return;
    if (isOn()) switchView(function () { bar.classList.toggle(name, want); });
    else bar.classList.toggle(name, want);
  }
  function command(cmd, data) {
    cmd = String(cmd || '');
    switch (cmd) {
      case 'air.on':     if (!isOn()) playIn(); break;
      case 'air.off':    if (isOn()) playOut(); break;
      case 'air.toggle': if (isOn()) playOut(); else playIn(); break;
      case 'air.on.full':
      case 'air.on.lower':
        if (isOn()) setState('fs', cmd === 'air.on.full');
        else { bar.classList.toggle('fs', cmd === 'air.on.full'); playIn(); }
        break;
      case 'layout.full':   setState('fs', true); break;
      case 'layout.lower':  setState('fs', false); break;
      case 'layout.toggle': setState('fs', !isFs()); break;
      case 'main.map':      setState('swap', false); break;
      case 'main.profile':  setState('swap', true); break;
      case 'main.toggle':   setState('swap', !bar.classList.contains('swap')); break;
      case 'card.on':       setState('nocard', false); break;
      case 'card.off':      setState('nocard', true); break;
      case 'card.toggle':   setState('nocard', !bar.classList.contains('nocard')); break;
      /* The camera glides between the two framings on its own: no morph */
      case 'map.track':     bar.classList.remove('follow'); break;
      case 'map.follow':    bar.classList.add('follow'); break;
      case 'map.toggle':    bar.classList.toggle('follow'); break;
      default:
        if (window.a350fDataCommand) window.a350fDataCommand(cmd, data || {});
    }
  }
  window.a350fCommand = command;
  if (window.obsstudio) {
    if (AUTO_ANIM) {
      window.addEventListener('obsSourceVisibleChanged', function (e) {
        if (e.detail && e.detail.visible) playIn();
        else reset();
      });
      window.addEventListener('load', function () {
        setTimeout(function () { if (!animated) playIn(); }, 400);
      });
    }
  } else {
    window.addEventListener('load', playIn);
    /* Outside OBS: click to preview out/in, double-click for the fullscreen */
    var clickTimer = null;
    window.addEventListener('click', function () {
      clearTimeout(clickTimer);
      clickTimer = setTimeout(function () { command('air.toggle'); }, 250);
    });
    window.addEventListener('dblclick', function () {
      clearTimeout(clickTimer);
      command('layout.toggle');
    });
  }

  /* Starting state, in the same words as the commands:
       ?layout=full|lower  ?main=map|profile  ?card=on|off  ?map=track|follow */
  ['layout', 'main', 'card', 'map'].forEach(function (p) {
    if (q.has(p)) command(p + '.' + q.get(p));
  });
  /* Preview shortcuts (and OBS "Interact"): R corner card, S swap views,
     F follow the aircraft / frame the whole track */
  window.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    if (k === 'r') command('card.toggle');
    if (k === 's') command('main.toggle');
    if (k === 'f') command('map.toggle');
  });

  /* ===== Companion feedback: ?companion=HOST[:PORT] pushes state into
     Companion custom variables (a350f_<name>) over its HTTP API. The view
     state mirrors the command namespaces one for one; the flight data is
     pushed by the main script below through the same function. */
  var COMP = q.get('companion');
  if (COMP && COMP.indexOf(':') < 0) COMP += ':8000';
  var compLast = {};
  window.a350fFeedback = function (name, value, force) {
    if (!COMP || (compLast[name] === value && !force)) return;
    compLast[name] = value;
    fetch('http://' + COMP + '/api/custom-variable/a350f_' + name +
          '/value?value=' + encodeURIComponent(value),
          { method: 'POST', mode: 'no-cors' }).catch(function () {});
  };
  function pushViewState() {
    a350fFeedback('air', isOn() ? 'on' : 'off');
    a350fFeedback('layout', isFs() ? 'full' : 'lower');
    a350fFeedback('main', bar.classList.contains('swap') ? 'profile' : 'map');
    a350fFeedback('card', bar.classList.contains('nocard') ? 'off' : 'on');
    a350fFeedback('map', bar.classList.contains('follow') ? 'follow' : 'track');
  }
  new MutationObserver(pushViewState).observe(bar, { attributes: true, attributeFilter: ['class'] });
  pushViewState();

  /* ===== obs-websocket client: Companion sends
     BroadcastCustomEvent {"eventData":{"a350f":"<command>"}}.
     ?obspw=PASSWORD (&obsport=4455) */
  var OBS_PW = q.get('obspw') || '';
  var OBS_PORT = q.get('obsport') || '4455';
  function b64(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }
  function sha256b64(str) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(b64);
  }
  function connectOBS() {
    var ws;
    try { ws = new WebSocket('ws://127.0.0.1:' + OBS_PORT); } catch (e) { return; }
    ws.onmessage = function (ev) {
      var msg = JSON.parse(ev.data);
      if (msg.op === 0) { /* Hello */
        var ident = { op: 1, d: { rpcVersion: 1, eventSubscriptions: 1 } };
        var auth = msg.d.authentication;
        if (auth) {
          sha256b64(OBS_PW + auth.salt).then(function (secret) {
            return sha256b64(secret + auth.challenge);
          }).then(function (a) {
            ident.d.authentication = a;
            ws.send(JSON.stringify(ident));
          });
        } else {
          ws.send(JSON.stringify(ident));
        }
      } else if (msg.op === 5 && msg.d.eventType === 'CustomEvent') {
        var d = msg.d.eventData || {};
        if (d.a350f) command(d.a350f, d);
      }
    };
    ws.onclose = function () { setTimeout(connectOBS, 5000); };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }
  connectOBS();
})();
</script>
<script>
/* Premier vol de l'Airbus A350F · Toulouse-Blagnac · 29 septembre 2026
   Live position from ADS-B (adsb.lol, adsb.fi), through a350f-relay.js. */
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var TZ = 'Europe/Paris';
  function $(id) { return document.getElementById(id); }
  var bar = $('bar');

  // --- Configuration ---
  // F-WXLD (MSN 700) broadcasts as 39A53B per the tar1090 aircraft database.
  // If it ever turns up under another address, the registration lookup
  // below finds it and the page follows that one instead.
  var REG = (params.get('reg') || 'F-WXLD').toUpperCase();
  var HEX = (params.get('hex') || '39a53b').toLowerCase();
  var CALLSIGN = (params.get('callsign') || '').toUpperCase();
  var MSN = params.get('msn') || '700';
  var DAY = params.get('date') || '2026-09-29';
  var T0 = parisTime(DAY, params.get('t0') || '10:30');   // scheduled take-off
  var DUR = (parseFloat(params.get('dur')) || 240) * 60000; // planned flight time
  var POLL_MS = Math.max(1000, (parseFloat(params.get('poll')) || 2) * 1000);
  var TAKEOFF_OVERRIDE = params.get('takeoff') ? parisTime(DAY, params.get('takeoff')) : null;
  var HOME = { lat: 43.629101, lon: 1.36382, elev: 499 };  // LFBO reference point
  var RUNWAYS = [  // threshold to threshold: 14R/32L, 14L/32R
    [43.64410, 1.34593, 43.61900, 1.37210],
    [43.63740, 1.35762, 43.61560, 1.38022]
  ];

  var DEMO = params.has('demo');
  var DEMO_SPEED = parseFloat(params.get('speed') || '30');
  var DEMO_FROM = parseFloat(params.get('from') || '-8'); // minutes from T0
  var demoAnchor = Date.now();
  function now() {
    if (!DEMO) return Date.now();
    return T0 + DEMO_FROM * 60000 + (Date.now() - demoAnchor) * DEMO_SPEED;
  }

  // "HH:MM[:SS]" on a given day in Paris time → epoch ms (or a full ISO string)
  function parisTime(day, hms) {
    if (/T/.test(hms)) return Date.parse(hms);
    if (hms.length === 5) hms += ':00';
    var guess = Date.parse(day + 'T' + hms + 'Z');
    var p = {};
    new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hourCycle: 'h23', year: 'numeric', month: '2-digit',
      day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' })
      .formatToParts(new Date(guess)).forEach(function (x) { p[x.type] = x.value; });
    var asParis = Date.parse(p.year + '-' + p.month + '-' + p.day + 'T' + p.hour + ':' + p.minute + ':' + p.second + 'Z');
    return guess - (asParis - guess);
  }
  // A time typed by the operator ("9:45", "10:34:12") on the flight day
  function parseHM(v) {
    var m = /^(\d{1,2}):(\d{2})(?::(\d{2}))?$/.exec(v);
    if (!m || +m[1] > 23 || +m[2] > 59 || +(m[3] || 0) > 59) return null;
    return parisTime(DAY, pad(+m[1]) + ':' + m[2] + ':' + (m[3] || '00'));
  }

  // ===== Operator overrides =====
  // Set at run time from Companion or the status page, instead of editing
  // the source URL and reloading it on air: a new take-off time when the
  // flight slips, the actual take-off when the page missed it, a headline of
  // the operator's own, a neutral wording. Kept per aircraft and day, and
  // shared by every browser source of this page (the lower third and the
  // fullscreen may be two sources): each receives the command, and the
  // storage event brings any that missed it in step.
  var CTL_KEY = 'a350f:ctl:' + (DEMO ? 'demo' : REG + ':' + DAY);
  var ctl = { t0: null, takeoff: null, headline: '', mode: 'auto', units: null };
  function loadCtl() {
    try { Object.assign(ctl, JSON.parse(localStorage.getItem(CTL_KEY) || '{}')); } catch (e) {}
  }
  function saveCtl() {
    try { localStorage.setItem(CTL_KEY, JSON.stringify(ctl)); } catch (e) {}
  }
  try { if (DEMO || params.has('reset')) localStorage.removeItem(CTL_KEY); } catch (e) {}
  loadCtl();
  window.addEventListener('storage', function (e) {
    if (e.key === CTL_KEY) { loadCtl(); ctlChanged(); }
  });
  function schedTime() { return ctl.t0 || T0; }
  /* t0.HH:MM | t0.+N | t0.-N | t0.reset          scheduled take-off
     takeoff.now | takeoff.HH:MM[:SS] | takeoff.auto   actual take-off
     headline.<TEXT> | headline.set (+ "text") | headline.auto
     mode.neutral | mode.auto | mode.toggle        factual wording only */
  var dataCommands = {
    t0: function (v) {
      if (v === 'reset') ctl.t0 = null;
      else if (/^[+-]\d+$/.test(v)) ctl.t0 = schedTime() + parseInt(v, 10) * 60000;
      else if (parseHM(v) != null) ctl.t0 = parseHM(v);
      else return false;
    },
    takeoff: function (v) {
      if (v === 'auto') ctl.takeoff = null;
      else if (v === 'now') ctl.takeoff = now();
      else if (parseHM(v) != null) ctl.takeoff = parseHM(v);
      else return false;
    },
    headline: function (v, data) {
      if (v === 'auto') ctl.headline = '';
      else ctl.headline = String(v === 'set' ? data.text || '' : v).trim().slice(0, 90);
    },
    mode: function (v) {
      if (v === 'toggle') v = ctl.mode === 'neutral' ? 'auto' : 'neutral';
      if (v !== 'neutral' && v !== 'auto') return false;
      ctl.mode = v;
    }
  };
  window.a350fDataCommand = function (cmd, data) {
    var dot = cmd.indexOf('.');
    var fn = dataCommands[dot < 0 ? cmd : cmd.slice(0, dot)];
    if (!fn || fn(dot < 0 ? '' : cmd.slice(dot + 1), data || {}) === false) return;
    saveCtl();
    ctlChanged();
  };
  function ctlChanged() {
    profDirty = true;
    updateText();
  }

  // --- Formatting ---
  var nf = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 });
  var hmsFmt = new Intl.DateTimeFormat('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: TZ });
  var hmFmt = new Intl.DateTimeFormat('fr-FR', { hour: '2-digit', minute: '2-digit', timeZone: TZ });
  var dayFmt = new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'long', year: 'numeric', timeZone: TZ });
  function fmtT(ms) { return hmsFmt.format(new Date(ms)); }
  function fmtTS(ms) { return hmFmt.format(new Date(ms)); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function fmtClock(ms) {
    if (ms < 0) ms = 0;
    var s = Math.floor(ms / 1000);
    if (s >= 86400) {
      var d = Math.floor(s / 86400);
      return d + 'd ' + pad(Math.floor((s % 86400) / 3600)) + 'h ' + pad(Math.floor((s % 3600) / 60)) + 'm';
    }
    return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor((s % 3600) / 60)) + ':' + pad(s % 60);
  }
  /* Coarse duration for chat text: "2 j 05 h", "1 h 03", "24 min" — changes
     at most once a minute, like the eclipse's eclipse_eta. */
  function fmtCoarse(ms) {
    if (ms < 0) ms = 0;
    var m = Math.floor(ms / 60000);
    if (m >= 1440) return Math.floor(m / 1440) + ' j ' + pad(Math.floor((m % 1440) / 60)) + ' h';
    if (m >= 60) return Math.floor(m / 60) + ' h ' + pad(m % 60);
    if (m >= 1) return m + ' min';
    return 'moins d\'une minute';
  }
  function ft(v) { return nf.format(Math.round(v / 25) * 25); }
  function m(v) { return nf.format(Math.round(v * 0.3048 / 10) * 10); }
  function kmh(kt) { return nf.format(Math.round(kt * 1.852)); }
  function vsTxt(v) { var r = Math.round(v / 50) * 50; return (r > 0 ? '+' : r < 0 ? '−' : '') + nf.format(Math.abs(r)); }
  function hdg(v) { return String(Math.round(v) % 360).padStart(3, '0') + '°'; }
  var DIRS = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSO', 'SO', 'OSO', 'O', 'ONO', 'NO', 'NNO'];
  var DIRS_LONG = ['nord', 'nord-nord-est', 'nord-est', 'est-nord-est', 'est', 'est-sud-est', 'sud-est', 'sud-sud-est',
                   'sud', 'sud-sud-ouest', 'sud-ouest', 'ouest-sud-ouest', 'ouest', 'ouest-nord-ouest', 'nord-ouest', 'nord-nord-ouest'];
  function compass(az, long) { return (long ? DIRS_LONG : DIRS)[Math.round(((az % 360) + 360) % 360 / 22.5) % 16]; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  // --- Geometry ---
  var RAD = Math.PI / 180;
  function distKm(aLat, aLon, bLat, bLon) {
    var dLat = (bLat - aLat) * RAD, dLon = (bLon - aLon) * RAD;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(aLat * RAD) * Math.cos(bLat * RAD) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 12742 * Math.asin(Math.min(1, Math.sqrt(h)));
  }
  function bearing(aLat, aLon, bLat, bLon) {
    var y = Math.sin((bLon - aLon) * RAD) * Math.cos(bLat * RAD);
    var x = Math.cos(aLat * RAD) * Math.sin(bLat * RAD) - Math.sin(aLat * RAD) * Math.cos(bLat * RAD) * Math.cos((bLon - aLon) * RAD);
    return (Math.atan2(y, x) / RAD + 360) % 360;

  function merc(lat, lon) {
    var s = Math.max(-0.9999, Math.min(0.9999, Math.sin(lat * RAD)));
    return { x: (lon + 180) / 360, y: 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI) };
  }

  // ===== Flight state =====
  // samples: every position report received, in time order; live: the
  // newest one, with everything else it carried. The samples survive a
  // reload of the browser source (localStorage), and when the page is served
  // by the relay they are topped up from its recording (/adsb/history) on
  // load, after a reconnection and every minute — so a gap on this side, or
  // a page opened for the first time mid-flight, still gets the whole flight.
  var STORE = 'a350f:' + (DEMO ? 'demo' : REG + ':' + DAY);
  var st = { samples: [], takeoff: null, landing: null, airSeen: false, altMax: 0, gsMax: 0, dist: 0, hex: HEX,
             events: [] };
  try {
    if (DEMO || params.has('reset')) localStorage.removeItem(STORE);
    var saved = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (saved && saved.samples) st = saved;
    st.events = st.events || [];
    if (st.hex && !params.get('hex')) HEX = st.hex;
  } catch (e) { /* storage unavailable: start fresh */ }
  var saveAt = 0;
  function save(force) {
    if (DEMO) return;
    var t = Date.now();
    if (!force && t - saveAt < 10000) return;
    saveAt = t;
    try { localStorage.setItem(STORE, JSON.stringify(st)); } catch (e) {}
  }
  window.addEventListener('pagehide', function () { save(true); }); // OBS source refresh
  var live = null;      // last report: position, altitude, speeds…
  var lastPhase = '';

    function sx(x) { return w / 2 + (x - cam.x) * ws; }
    function sy(y) { return h / 2 + (y - cam.y) * ws; }
    var sc = Math.pow(2, cam.z - ZREF);
    trkG.setAttribute('transform', 'translate(' + sx(ORIGIN.x).toFixed(2) + ' ' + sy(ORIGIN.y).toFixed(2) +
                                   ') scale(' + sc.toFixed(6) + ')');
    var hm = merc(HOME.lat, HOME.lon), hx = sx(hm.x), hy = sy(hm.y);
    homeG.setAttribute('transform', 'translate(' + hx.toFixed(1) + ' ' + hy.toFixed(1) + ')');
    planeBox.classList.toggle('nodata', !pl);
    // Up close the runways take over from the airport marker, and the marker
    // steps aside whenever the aircraft (and its tag) is on top of it.
    var px = pl ? sx(pl.x) : -1e4, py = pl ? sy(pl.y) : -1e4;
    homeG.style.opacity = cam.z > 12.2 || (px > hx - 90 && px < hx + 260 && Math.abs(py - hy) < 70) ? 0 : 1;
    if (pl) {
      planePos.style.transform = 'translate(' + px.toFixed(1) + 'px,' + py.toFixed(1) + 'px)';
      planeIcon.style.transform = 'rotate(' + (live.trk || 0).toFixed(1) + 'deg)';
      // join the last recorded point to the aircraft so the line reaches it
      var ls = st.samples[st.samples.length - 1];
      if (ls && (!live.gnd || st.takeoff)) {
        var q = merc(ls.lat, ls.lon);
        trkHead.setAttribute('x1', sx(q.x).toFixed(1)); trkHead.setAttribute('y1', sy(q.y).toFixed(1));
        trkHead.setAttribute('x2', px.toFixed(1)); trkHead.setAttribute('y2', py.toFixed(1));
        trkHead.style.display = '';
      } else trkHead.style.display = 'none';
    } else trkHead.style.display = 'none';
  }
  requestAnimationFrame(frame);

  // ===== Flight profile: altitude (area) and ground speed (dashed) =====
  var profSvg = $('profsvg'), profDirty = true;
  function drawProfile() {
    profDirty = false;
    var w = profSvg.clientWidth, h = profSvg.clientHeight;
    if (!w || !h) return;
    var onCanvas = bar.classList.contains('fs') && bar.classList.contains('swap');
    var big = onCanvas;
    var fsz = big ? 17 : 12;
    var box;
    if (onCanvas) {
      // the same free area the map camera uses, minus room for the axes
      var sr = profSvg.getBoundingClientRect();
      var col = $('rcol').getBoundingClientRect();
      var tick = document.querySelector('.rv-ticker').getBoundingClientRect();
      var card = $('mapscene'), cr = card.offsetWidth && !bar.classList.contains('nocard') ? card.getBoundingClientRect() : null;
      box = { l: 90 + 86, t: 40, r: col.left - sr.left - 70, b: (cr ? cr.top : tick.top) - sr.top - 64 };
    } else {
      box = { l: 50, t: 10, r: w - 40, b: h - 24 };
    }
    if (box.r - box.l < 60 || box.b - box.t < 40) { profSvg.innerHTML = ''; return; }
    profSvg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    var t = now(), to = takeoffTime(), T0 = schedTime();
    // From 5 min before take-off (or before the first airborne point, when
    // the page joined mid-flight); nothing but the axes until then.
    var from = to;
    if (!from && st.airSeen) st.samples.some(function (s) { return !s.g && (from = s.t); });
    var S = from ? st.samples.filter(function (s) { return s.t >= from - 5 * 60000; }) : [];
    var ta = from ? from - 5 * 60000 : Math.min(t, T0) - 10 * 60000;
    var tb = Math.max(t, (to || T0) + DUR);
    if (st.landing) tb = Math.max(st.landing + 10 * 60000, Math.min(tb, st.landing + 20 * 60000));
    S = S.filter(function (s) { return s.t <= tb; }); // taxiing long after landing
    var aMax = Math.max(10000, Math.ceil((st.altMax + 3000) / 10000) * 10000);
    var sMax = Math.max(300, Math.ceil((st.gsMax + 40) / 100) * 100);
    function X(tt) { return box.l + (tt - ta) / (tb - ta) * (box.r - box.l); }
    function Y(a) { return box.b - a / aMax * (box.b - box.t); }
    function YS(s) { return box.b - s / sMax * (box.b - box.t); }
    var o = [];
    o.push('<defs><linearGradient id="pfill" x1="0" y1="0" x2="0" y2="1">' +
           '<stop offset="0" stop-color="#e1000f" stop-opacity="0.75"/>' +
           '<stop offset="1" stop-color="#e1000f" stop-opacity="0.08"/></linearGradient></defs>');
    var step = aMax <= 20000 ? 5000 : 10000;
    for (var a = step; a <= aMax; a += step) {
      o.push('<line x1="' + box.l + '" x2="' + box.r + '" y1="' + Y(a).toFixed(1) + '" y2="' + Y(a).toFixed(1) +
             '" stroke="rgba(255,255,255,0.16)" stroke-dasharray="3 7"/>');
      o.push('<text x="' + (box.l - 8) + '" y="' + (Y(a) + fsz * 0.35).toFixed(1) + '" text-anchor="end" font-size="' + fsz +
             '" fill="rgba(255,255,255,0.6)">' + nf.format(a) + (big ? ' ft' : '') + '</text>');
    }
    var sStep = sMax <= 400 ? 100 : 200;
    for (var sv = sStep; sv <= sMax; sv += sStep) {
      o.push('<text x="' + (box.r + 8) + '" y="' + (YS(sv) + fsz * 0.35).toFixed(1) + '" font-size="' + fsz +
             '" fill="rgba(160,190,255,0.75)">' + sv + (big ? ' kt' : '') + '</text>');
    }
    o.push('<line x1="' + box.l + '" x2="' + box.r + '" y1="' + box.b + '" y2="' + box.b + '" stroke="#fff" stroke-width="2"/>');
    // time ticks on round hours / half hours, at most ~6 of them
    var tickMs = [1800000, 3600000, 7200000, 10800000, 21600000].filter(function (s) {
      return (tb - ta) / s <= 6;
    })[0] || 43200000;
    for (var tt = Math.ceil(ta / tickMs) * tickMs; tt <= tb; tt += tickMs) {
      o.push('<line x1="' + X(tt).toFixed(1) + '" x2="' + X(tt).toFixed(1) + '" y1="' + box.b + '" y2="' + (box.b + 6) +
             '" stroke="rgba(255,255,255,0.6)"/>');
      o.push('<text x="' + X(tt).toFixed(1) + '" y="' + (box.b + fsz + 8) + '" text-anchor="middle" font-size="' + fsz +
             '" fill="rgba(255,255,255,0.6)">' + fmtTS(tt) + '</text>');
    }
    if (!S.length) {
      o.push('<text x="' + ((box.l + box.r) / 2) + '" y="' + ((box.t + box.b) / 2) + '" text-anchor="middle" font-size="' +
             (fsz + 4) + '" font-weight="900" fill="rgba(255,255,255,0.8)">EN ATTENTE DU DÉCOLLAGE</text>');
    } else {
      var line = [], spd = [], lastX = -1e9;
      S.forEach(function (s, i) {
        // every point is kept, but one per pixel column is all a line needs
        var px = X(s.t);
        if (px - lastX < 1 && i < S.length - 1) return;
        lastX = px;
        var alt = s.g ? 0 : Math.max(0, (s.a == null ? HOME.elev : s.a) - HOME.elev);
        line.push(X(s.t).toFixed(1) + ',' + Y(alt).toFixed(1));
        spd.push(X(s.t).toFixed(1) + ',' + YS(s.s).toFixed(1));
      });
      var x0 = X(S[0].t).toFixed(1), x1 = X(S[S.length - 1].t).toFixed(1);
      o.push('<polygon points="' + x0 + ',' + box.b + ' ' + line.join(' ') + ' ' + x1 + ',' + box.b + '" fill="url(#pfill)"/>');
      o.push('<polyline points="' + spd.join(' ') + '" fill="none" stroke="rgba(160,190,255,0.85)" stroke-width="' +
             (big ? 2.5 : 1.6) + '" stroke-dasharray="' + (big ? '10 8' : '6 5') + '"/>');
      o.push('<polyline points="' + line.join(' ') + '" fill="none" stroke="#fff" stroke-width="' + (big ? 3.5 : 2.2) +
             '" stroke-linejoin="round"/>');
      var ls = S[S.length - 1], lalt = ls.g ? 0 : Math.max(0, (ls.a || HOME.elev) - HOME.elev);
      o.push('<circle cx="' + x1 + '" cy="' + Y(lalt).toFixed(1) + '" r="' + (big ? 8 : 5) +
             '" fill="#e1000f" stroke="#fff" stroke-width="' + (big ? 3 : 2) + '"/>');
      [[to, 'DÉCOLLAGE'], [st.landing, 'ATTERRISSAGE']].forEach(function (mk) {
        if (!mk[0] || mk[0] < ta) return;
        var mx = X(mk[0]).toFixed(1);
        o.push('<line x1="' + mx + '" x2="' + mx + '" y1="' + box.t + '" y2="' + box.b + '" stroke="rgba(255,255,255,0.5)" stroke-dasharray="2 5"/>');
        // label on whichever side of the line keeps it clear of the axes
        var rightHalf = +mx > (box.l + box.r) / 2;
        if (big) o.push('<text x="' + (+mx + (rightHalf ? -8 : 8)) + '" y="' + (box.t + fsz) + '" font-size="' + fsz +
                        '" text-anchor="' + (rightHalf ? 'end' : 'start') +
                        '" font-weight="900" fill="#fff">' + mk[1] + ' ' + fmtTS(mk[0]) + '</text>');
      });
    }
    if (big) {
      // legend, bottom-right of the plot
      var lx = box.r - 330, ly = box.b + fsz + 40;
      o.push('<rect x="' + lx + '" y="' + (ly - 11) + '" width="36" height="10" fill="#e1000f" stroke="#fff" stroke-width="2"/>');
      o.push('<text x="' + (lx + 46) + '" y="' + ly + '" font-size="16" font-weight="700" fill="#fff">ALTITUDE</text>');
      o.push('<line x1="' + (lx + 170) + '" x2="' + (lx + 206) + '" y1="' + (ly - 6) + '" y2="' + (ly - 6) +
             '" stroke="rgba(160,190,255,0.9)" stroke-width="3" stroke-dasharray="9 6"/>');
      o.push('<text x="' + (lx + 216) + '" y="' + ly + '" font-size="16" font-weight="700" fill="#fff">VITESSE SOL</text>');
    }
    profSvg.innerHTML = o.join('');
  }
  if (window.ResizeObserver) new ResizeObserver(function () { profDirty = true; }).observe(profSvg);
  new MutationObserver(function () { profDirty = true; setTimeout(function () { profDirty = true; }, 700); })
    .observe(bar, { attributes: true, attributeFilter: ['class'] });
  var profAt = 0, profSamples = -1;
  setInterval(function () {
    // redraw on a new sample, a layout change, or every 10 s for the clock
    if (profDirty || st.samples.length !== profSamples || Date.now() - profAt > 10000) {
      profSamples = st.samples.length; profAt = Date.now();
      drawProfile();
    }
  }, 500);

  updateText();
  setInterval(updateText, 250);
})();
</script>
<script>
/* Auto-fit the headline to one line, in every state and every frame of the
   morph (same as the eclipse bar). */
(function () {
  var bar = document.getElementById('bar');
  var status = document.getElementById('status');
  var headline = document.getElementById('headline');
  var redband = document.getElementById('redband');
  if (!bar || !status || !headline || !redband) return;

  var MIN = 20, HARD_MAX = 76;
  var probe = document.createElement('span');
  probe.style.cssText = 'position:absolute;left:-9999px;top:0;white-space:nowrap;' +
                        'visibility:hidden;pointer-events:none;';
  document.body.appendChild(probe);

  function fit() {
    var avail = headline.clientWidth - 4;
    if (avail <= 0) return;
    var cs = getComputedStyle(status);
    probe.style.fontFamily = cs.fontFamily;
    probe.style.fontWeight = cs.fontWeight;
    probe.style.letterSpacing = cs.letterSpacing;
    probe.style.textTransform = cs.textTransform;
    probe.style.fontSize = '100px';
    probe.textContent = status.textContent;
    var w100 = probe.offsetWidth || 1;
    /* Cap tracks the red band height, which animates -> no sudden jump. */
    var cap = Math.min(HARD_MAX, redband.clientHeight * 0.5);
    var size = Math.min(cap, (avail / w100) * 100);
    status.style.fontSize = Math.max(MIN, size).toFixed(1) + 'px';
  }

  var until = 0, ticking = false;
  function pump() {
    fit();
    if (performance.now() < until) requestAnimationFrame(pump);
    else ticking = false;
  }
  function refitFor(ms) {
    until = performance.now() + ms;
    if (!ticking) { ticking = true; requestAnimationFrame(pump); }
  }

  new MutationObserver(function () { refitFor(1000); })
    .observe(bar, { attributes: true, attributeFilter: ['class'] });
  new MutationObserver(function () { fit(); })
    .observe(status, { childList: true, characterData: true, subtree: true });
  if (window.ResizeObserver) new ResizeObserver(fit).observe(headline);
  window.addEventListener('resize', fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  fit();
})();
</script>
</body>

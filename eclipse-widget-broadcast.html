<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Éclipse solaire · Thonac</title>
<style>
  :root {
    --red: #e1000f;
    --navy: #10173a;
    --navy-2: #1b2450;
    --blue: #2857c8;
    --white: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; }
  body {
    font-family: 'Univers Next', 'Univers Next Pro', 'UniversNext', 'Univers Next W1G', 'Arial Narrow', 'Helvetica Neue Condensed', 'Segoe UI', Arial, sans-serif;
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  #bar { --deep: 0; width: 100%; display: flex; align-items: flex-end; }

  /* ===== Choreographed broadcast reveal =====
     0.00s  red band wipes open left→right
     0.10s  sun panel slides in from the left
     0.20s  headline text slides in
     0.35s  ticker band rises
     0.38s  countdown fades up
     0.45s  sun disc pops with overshoot
     0.50s  light sheen sweeps across the red band
     0.55s  white strap rises
     0.60s+ ticker segments cascade in, then clock
     0.85s  progress line grows from the left */
  .rv { overflow: hidden; }
  .rv > *, #skywrap, #status, #cdwrap, .seg, #clock, #timeline {
    will-change: transform, opacity; backface-visibility: hidden;
  }
  /* Hidden base states (parked, before .on) */
  #redband { position: relative; overflow: hidden; clip-path: inset(0 100% 0 0); }
  #sunpanel { transform: translate3d(-110%, 0, 0); }
  #skywrap, #moonwrap { transform: scale(0); }
  #strap, #ticker { transform: translate3d(0, 110%, 0); }
  #status, #cdwrap, .seg, #clock { opacity: 0; }
  #timeline { transform: scaleX(0); transform-origin: left center; }
  /* Sheen element */
  #redband::after {
    content: ''; position: absolute; top: 0; bottom: 0; width: 34%; left: 0;
    background: linear-gradient(105deg, transparent, rgba(255,255,255,0.28), transparent);
    transform: translateX(-300%) skewX(-15deg); pointer-events: none;
  }

  @keyframes kWipe  { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes kSlideL{ from { transform: translate3d(-110%,0,0); } to { transform: translate3d(0,0,0); } }
  @keyframes kRise  { from { transform: translate3d(0,110%,0); } to { transform: translate3d(0,0,0); } }
  @keyframes kPop   { 0% { transform: scale(0); } 70% { transform: scale(1.09); } 100% { transform: scale(1); } }
  @keyframes kText  { from { opacity: 0; transform: translate3d(-24px,0,0); } to { opacity: 1; transform: none; } }
  @keyframes kFadeUp{ from { opacity: 0; transform: translate3d(0,14px,0); } to { opacity: 1; transform: none; } }
  @keyframes kSheen { to { transform: translateX(340%) skewX(-15deg); } }
  @keyframes kGrowX { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  #bar.on #redband        { animation: kWipe  0.45s cubic-bezier(0.22,1,0.36,1) 0s     both; }
  #bar.on #sunpanel       { animation: kSlideL 0.5s cubic-bezier(0.22,1,0.36,1) 0.1s   both; }
  #bar.on #status         { animation: kText  0.45s cubic-bezier(0.22,1,0.36,1) 0.2s   both; }
  #bar.on #ticker         { animation: kRise  0.5s  cubic-bezier(0.22,1,0.36,1) 0.35s  both; }
  #bar.on #cdwrap         { animation: kFadeUp 0.4s ease-out                    0.38s  both; }
  #bar.on #skywrap        { animation: kPop   0.5s  cubic-bezier(0.34,1.56,0.64,1) 0.45s both; }
  #bar.on #moonwrap       { animation: kPop   0.5s  cubic-bezier(0.34,1.56,0.64,1) 0.55s both; }
  #bar.on #redband::after { animation: kSheen 0.7s  ease                        0.5s   both; }
  #bar.on #strap          { animation: kRise  0.45s cubic-bezier(0.22,1,0.36,1) 0.55s  both; }
  #bar.on .seg            { animation: kText  0.35s ease-out both; }
  #bar.on .seg:nth-child(1) { animation-delay: 0.6s; }
  #bar.on .seg:nth-child(2) { animation-delay: 0.72s; }
  #bar.on .seg:nth-child(3) { animation-delay: 0.84s; }
  #bar.on .seg:nth-child(4) { animation-delay: 0.96s; }
  #bar.on #clock          { animation: kFadeUp 0.35s ease-out                   1.05s  both; }
  #bar.on #timeline       { animation: kGrowX 0.45s cubic-bezier(0.22,1,0.36,1) 0.85s  both; }

  /* ===== Reverse choreography (out, ~0.65s total) ===== */
  @keyframes kWipeOut  { from { clip-path: inset(0 0 0 0); } to { clip-path: inset(0 100% 0 0); } }
  @keyframes kSlideLOut{ from { transform: translate3d(0,0,0); } to { transform: translate3d(-110%,0,0); } }
  @keyframes kDrop     { from { transform: translate3d(0,0,0); } to { transform: translate3d(0,110%,0); } }
  @keyframes kTextOut  { from { opacity: 1; transform: none; } to { opacity: 0; transform: translate3d(-24px,0,0); } }
  @keyframes kFadeDown { from { opacity: 1; transform: none; } to { opacity: 0; transform: translate3d(0,14px,0); } }
  @keyframes kShrinkX  { from { transform: scaleX(1); } to { transform: scaleX(0); } }

  #bar.off #timeline  { animation: kShrinkX 0.25s ease-in 0s both; }
  #bar.off .seg       { animation: kTextOut 0.2s ease-in 0s both; }
  #bar.off #clock     { animation: kFadeDown 0.2s ease-in 0s both; }
  #bar.off #cdwrap    { animation: kFadeDown 0.25s ease-in 0s both; }
  #bar.off #strap     { animation: kDrop 0.3s ease-in 0.05s both; }
  #bar.off #status    { animation: kTextOut 0.3s ease-in 0.08s both; }
  #bar.off #ticker    { animation: kDrop 0.35s ease-in 0.12s both; }
  #bar.off #redband   { animation: kWipeOut 0.4s cubic-bezier(0.5,0,0.75,0) 0.18s both; }
  #bar.off #sunpanel  { animation: kSlideLOut 0.4s cubic-bezier(0.5,0,0.75,0) 0.22s both; }

  /* ===== Full-height sun panel on the left ===== */
  .rv-sun { flex: 0 0 202px; height: 202px; }
  #sunpanel {
    width: 100%; height: 100%; background: var(--navy);
    display: flex; align-items: center; justify-content: center;
  }
  #skywrap { position: relative; width: 172px; height: 172px; }
  #corona {
    position: absolute; inset: -18px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.4) 30%, rgba(200,215,255,0.15) 55%, transparent 72%);
    opacity: 0; transition: opacity 1s; pointer-events: none;
  }
  #right { flex: 1 1 auto; min-width: 0; }

  /* ===== White info strap (like the name strap) ===== */
  .rv-strap { width: fit-content; max-width: 85vw; }
  #strap {
    display: inline-flex; align-items: center; gap: 14px;
    height: 46px; background: var(--white); color: #111;
    padding: 0 22px; margin-left: 0;
    white-space: nowrap;
  }
  #strap b {
    font-size: 24px; font-weight: 900;
    font-variant-numeric: tabular-nums;
  }
  #strap b #pct { font-family: inherit; }
  #strap .blue { color: var(--blue); font-weight: 700; font-size: 19px; }
  #sunpos {
    font-size: 19px; color: #111; font-weight: 400;
    font-variant-numeric: tabular-nums;
  }

  /* ===== Big red headline band ===== */
  #redband {
    display: flex; align-items: center;
    height: 92px; background: var(--red); color: var(--white);
    padding: 0 34px;
  }
  #headline { min-width: 0; }
  #status {
    font-size: 46px; font-weight: 900; line-height: 1.22;
    text-transform: uppercase; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
    letter-spacing: -0.5px;
    text-shadow: 0 2px 0 rgba(0,0,0,0.12);
  }
  #cdwrap {
    margin-left: auto; padding-left: 30px;
    display: flex; align-items: baseline; gap: 16px; flex: 0 0 auto;
  }
  #cdlabel {
    font-size: 19px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; white-space: nowrap;
  }
  #countdown {
    font-size: 56px; font-weight: 900; line-height: 1;
    font-variant-numeric: tabular-nums; white-space: nowrap;
    font-family: 'Univers Next', 'Univers Next Pro', 'UniversNext', 'Univers Next W1G', 'Arial Narrow', Arial, sans-serif;
  }

  /* ===== Navy ticker band ===== */
  #ticker {
    display: flex; align-items: center;
    height: 54px; background: var(--navy); color: var(--white);
    padding: 0 0 0 34px;
    font-size: 21px; white-space: nowrap; overflow: hidden;
  }
  .seg { display: flex; align-items: baseline; gap: 10px; padding-right: 34px; }
  .seg .lbl { font-weight: 900; text-transform: uppercase; }
  .seg .val { font-weight: 400; font-variant-numeric: tabular-nums; }
  .seg .sub { font-size: 17px; color: rgba(255,255,255,0.55); }
  #clock {
    margin-left: auto; align-self: stretch;
    display: flex; align-items: center;
    background: var(--navy-2); padding: 0 26px;
    font-weight: 900; font-size: 24px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }

  /* Progress line */
  #timeline { position: relative; height: 10px; background: var(--navy-2); }
  #progressFill { height: 100%; width: 0%; background: var(--red); }
  .mk { position: absolute; top: 0; width: 3px; height: 10px; background: var(--white); }

  /* Headline stays on ONE line in every state; its size is auto-fitted in JS. */
  #headline { flex: 1 1 auto; }
  #status { transition: none; }

  /* ===== Fullscreen scene (Companion: {"eclipseLowerThird":"toggleView"}) =====
     Not a morph of the lower third: a dedicated full-canvas layout. The sky
     fills the screen and the info blocks float on top. The scene is framed
     like a camera: the Sun/Moon pair is held in the middle of whatever the
     overlay blocks leave free (clear of the countdown block top-right, the
     ticker at the bottom and the true-scale card bottom-left), and the sky
     itself pans behind them. Requires the browser source to cover the full
     canvas (1920x1080). Toggling the view replays the reveal choreography so
     the new layout assembles on air. */
  #sunpanel { position: relative; }
  #bar.fs { display: block; }
  #bar.fs .rv-sun { position: absolute; inset: 0; flex: none; height: 100vh; }
  #bar.fs #sunpanel { position: absolute; inset: 0; }
  #bar.fs #right { position: absolute; inset: 0; }

  /* Sky chart behind the disc: trajectories, horizon, contact markers */
  #skychart {
    display: none; position: absolute; inset: 0;
    width: 100%; height: 100%; pointer-events: none;
  }
  #bar.fs #skychart { display: block; animation: kFadeUp 0.55s ease-out 0.25s backwards; }
  #skychart text { font-variant-numeric: tabular-nums; }
  /* Camera layers inside the chart: #skypan carries everything tied to sky
     coordinates (paths, grid, horizon, ground, markers, compass) and takes the
     full pan; #skyalt holds the altitude labels, which follow the grid
     vertically but stay pinned to the left edge; the caption/legend layer
     never moves. 1s linear = the same glide as the discs, so the sky and the
     discs travel together between the once-per-second updates. */
  #skypan, #skyalt { transition: transform 1s linear; }

  /* The discs ride the trajectory (left/top driven by JS, 1s linear
     transition = constant glide between the once-per-second updates) */
  #bar.fs #skywrap {
    position: absolute; width: 16vw; height: 16vw;
    margin-left: -8vw; margin-top: -8vw;
    left: var(--sunX, 37.5%); top: var(--sunY, 52%);
    transition: left 1s linear, top 1s linear,
                width 0.7s cubic-bezier(0.22,1,0.36,1),
                height 0.7s cubic-bezier(0.22,1,0.36,1),
                margin 0.7s cubic-bezier(0.22,1,0.36,1);
  }
  /* Visible Moon disc, same oversized scale as the Sun disc; its offset is
     the true angular offset, so it always sits exactly over the bite */
  #moonwrap { display: none; }
  #bar.fs #moonwrap {
    display: block; position: absolute; width: 16vw; height: 16vw;
    margin-left: -8vw; margin-top: -8vw;
    left: var(--moonX, 37.5%); top: var(--moonY, 52%);
    transition: left 1s linear, top 1s linear,
                width 0.7s cubic-bezier(0.22,1,0.36,1),
                height 0.7s cubic-bezier(0.22,1,0.36,1),
                margin 0.7s cubic-bezier(0.22,1,0.36,1);
  }
  /* Wide (whole-day) view: smaller discs — the sky map covers ~230° */
  #bar.fs.wide #skywrap, #bar.fs.wide #moonwrap {
    width: 5vw; height: 5vw;
    margin-left: -2.5vw; margin-top: -2.5vw;
  }

  /* True-scale inset (bottom-left card): Sun & Moon at their real apparent
     size; the camera auto-zooms to keep both in frame (hide with ?noreal) */
  #realview {
    display: none; position: absolute;
    left: 0; bottom: 94px; width: 21vw;
    background: rgba(8,12,36,0.88);
    border: 1px solid rgba(255,255,255,0.22);
    flex-direction: column;
  }
  #bar.fs #realview { display: flex; animation: kFadeUp 0.5s ease-out 0.5s backwards; }
  #bar.fs.noreal #realview { display: none; }
  #rvhead {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 10px 14px 4px; color: #fff;
  }
  #rvhead b { font-size: 17px; font-weight: 900; letter-spacing: 0.5px; }
  #rvhead span { font-size: 15px; color: rgba(255,255,255,0.65); font-variant-numeric: tabular-nums; }
  #rvsvg { display: block; width: 100%; height: 21vw; }
  /* cx/cy/r/y are CSS geometry properties in Chromium: 1s linear matches the
     once-per-second updates for a continuous glide/zoom */
  #rvsvg circle, #rvsvg rect {
    transition: cx 1s linear, cy 1s linear, r 1s linear, y 1s linear, height 1s linear;
  }

  /* White strap: top-right corner */
  #bar.fs .rv-strap { position: absolute; top: 0; right: 0; width: auto; max-width: none; }
  #bar.fs #strap { height: 64px; padding: 0 44px; gap: 18px; }
  #bar.fs #strap b { font-size: 30px; }
  #bar.fs #strap .blue { font-size: 21px; }
  #bar.fs #sunpos { font-size: 19px; }

  /* Red block: headline + countdown, right-aligned under the strap */
  #bar.fs #redband {
    position: absolute; top: 64px; right: 0;
    width: 46vw; height: auto;
    flex-direction: column; align-items: flex-end; gap: 18px;
    padding: 30px 44px;
  }
  #bar.fs #headline { width: 100%; flex: 0 0 auto; }
  #bar.fs #status { text-align: right; }
  #bar.fs #cdwrap {
    margin: 0; padding: 0;
    flex-direction: column; align-items: flex-end; gap: 8px;
  }
  #bar.fs #cdlabel { font-size: 26px; }
  #bar.fs #countdown { font-size: 118px; }

  /* ===== Native morph between the two layouts (View Transitions API) =====
     Matching names let the browser tween each block's box between the
     lower third and the fullscreen scene while cross-fading its content.
     Browsers without support simply ignore these properties (the JS falls
     back to replaying the reveal choreography instead). */
  #sunpanel  { view-transition-name: vt-panel; }
  #skywrap   { view-transition-name: vt-sun; }
  #moonwrap  { view-transition-name: vt-moon; }
  #strap     { view-transition-name: vt-strap; }
  #redband   { view-transition-name: vt-red; }
  #ticker    { view-transition-name: vt-ticker; }
  #timeline  { view-transition-name: vt-timeline; }
  ::view-transition-group(*) {
    animation-duration: 0.65s;
    animation-timing-function: cubic-bezier(0.22,1,0.36,1);
  }
  ::view-transition-old(root), ::view-transition-new(root) {
    animation-duration: 0.65s;
  }

  /* Ticker pinned to the bottom, timeline underneath */
  #bar.fs .rv-ticker { position: absolute; left: 0; right: 0; bottom: 18px; }
  #bar.fs #ticker { height: 76px; padding-left: 44px; font-size: 23px; }
  #bar.fs .seg { padding-right: 40px; }
  #bar.fs .seg .sub { font-size: 18px; }
  #bar.fs #clock { font-size: 32px; padding: 0 36px; }
  #bar.fs #timeline { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; }
</style>
</head>
<body>
<div id="bar">
  <div class="rv rv-sun">
  <div id="sunpanel">
    <svg id="skychart" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div id="skywrap">
      <div id="corona"></div>
      <svg viewBox="-75 -75 150 150" width="100%" height="100%">
        <defs>
          <radialGradient id="sunGrad">
            <stop offset="0%" stop-color="#ffdf6b"/>
            <stop offset="70%" stop-color="#ffb62e"/>
            <stop offset="100%" stop-color="#f59300"/>
          </radialGradient>
          <mask id="biteMask">
            <rect x="-75" y="-75" width="150" height="150" fill="white"/>
            <circle id="moon" cx="-999" cy="0" r="40" fill="black"/>
          </mask>
        </defs>
        <circle id="sun" cx="0" cy="0" r="62" fill="url(#sunGrad)" mask="url(#biteMask)"/>
      </svg>
    </div>
    <div id="moonwrap" aria-hidden="true">
      <svg viewBox="-75 -75 150 150" width="100%" height="100%">
        <defs>
          <radialGradient id="moonGrad">
            <stop offset="0%" stop-color="#242e58"/>
            <stop offset="78%" stop-color="#1b2349"/>
            <stop offset="100%" stop-color="#161c3e"/>
          </radialGradient>
        </defs>
        <circle id="moondisc" cx="0" cy="0" r="63.9" fill="url(#moonGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
      </svg>
    </div>
    <div id="realview" aria-hidden="true">
      <div id="rvhead"><b>TAILLE RÉELLE</b><span id="rvfov">–</span></div>
      <svg id="rvsvg" viewBox="0 0 500 500" preserveAspectRatio="xMidYMid meet">
        <defs>
          <radialGradient id="rvSunGrad">
            <stop offset="0%" stop-color="#ffdf6b"/>
            <stop offset="70%" stop-color="#ffb62e"/>
            <stop offset="100%" stop-color="#f59300"/>
          </radialGradient>
          <radialGradient id="rvGlowGrad">
            <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
            <stop offset="55%" stop-color="rgba(200,215,255,0.18)"/>
            <stop offset="100%" stop-color="rgba(200,215,255,0)"/>
          </radialGradient>
          <radialGradient id="rvMoonGrad">
            <stop offset="0%" stop-color="#242e58"/>
            <stop offset="78%" stop-color="#1b2349"/>
            <stop offset="100%" stop-color="#161c3e"/>
          </radialGradient>
        </defs>
        <polyline id="rvsunpath" fill="none" stroke="rgba(255,210,87,0.6)" stroke-width="2.5" stroke-linejoin="round"/>
        <polyline id="rvmoonpath" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-dasharray="8 7"/>
        <circle id="rvglow" cx="250" cy="250" r="0" fill="url(#rvGlowGrad)" opacity="0"/>
        <circle id="rvsun" cx="250" cy="250" r="0" fill="url(#rvSunGrad)"/>
        <circle id="rvmoon" cx="250" cy="250" r="0" fill="url(#rvMoonGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
        <rect id="rvground" x="0" y="600" width="500" height="500" fill="#0a0f26" opacity="0.92"/>
        <rect id="rvhor" x="0" y="600" width="500" height="2.5" fill="#fff"/>
      </svg>
    </div>
  </div>
  </div>
  <div id="right">
  <div class="rv rv-strap">
  <div id="strap">
    <b><span id="pct">0,0%</span> du Soleil obscurci</b>
    <span class="blue">Thonac (Dordogne)</span>
    <span id="sunpos">…</span>
  </div>
  </div>
  <div id="redband">
    <div id="headline"><div id="status">…</div></div>
    <div id="cdwrap">
      <div id="cdlabel">…</div>
      <div id="countdown">--:--:--</div>
    </div>
  </div>
  <div class="rv rv-ticker">
  <div id="ticker">
    <div class="seg"><span class="lbl">Premier contact</span><span class="val" id="tC1">-</span></div>
    <div class="seg"><span class="lbl">Maximum</span><span class="val" id="tMax">-</span><span class="sub"><span id="tMaxPct">-</span> obscurci</span></div>
    <div class="seg"><span class="lbl">Coucher</span><span class="val" id="tSet">-</span><span class="sub">se couche éclipsé</span></div>
    <div class="seg"><span class="lbl">Fin</span><span class="val" id="tC4">-</span><span class="sub">sous l'horizon</span></div>
    <div id="clock">--:--:--</div>
  </div>
  </div>
  <div id="timeline">
    <div id="progressFill"></div>
    <div class="mk" id="mkMax"></div>
    <div class="mk" id="mkSet"></div>
  </div>
  </div>
</div>
<script>
/* Slide-in each time the source goes on air (Companion / OBS visibility toggle).
   The bar is reset off-screen the moment the source is hidden, so the first
   rendered frame after a show is never the end state. */
(function () {
  var bar = document.getElementById('bar');
  var animated = false;
  var q = new URLSearchParams(location.search);
  /* ?noautoanim — don't auto slide in/out when the OBS source's own
     visibility toggles; the bar then only reacts to explicit Companion
     show/hide commands (see the obs-websocket client below). */
  var AUTO_ANIM = !q.has('noautoanim');
  function playIn() {
    animated = true;
    bar.classList.remove('on');
    void bar.offsetWidth; /* flush so the slide always starts off-screen */
    requestAnimationFrame(function () { bar.classList.add('on'); });
  }
  function reset() {
    bar.classList.remove('on'); /* park off-screen while hidden */
  }
  function playOut() {
    bar.classList.remove('on');
    bar.classList.add('off');
  }
  /* Morph between lower third and fullscreen. Modern CEF (Chromium 111+)
     tweens each matching block natively via the View Transitions API;
     older browsers fall back to replaying the reveal choreography. */
  function switchView(change) {
    if (document.startViewTransition) {
      document.startViewTransition(change);
    } else {
      change();
      playIn();
    }
  }
  if (window.obsstudio) {
    if (AUTO_ANIM) {
      window.addEventListener('obsSourceVisibleChanged', function (e) {
        if (e.detail && e.detail.visible) playIn();
        else reset();
      });
      /* Fallback: if the page loaded while already visible and OBS sends no
         initial event, animate in shortly after load. */
      window.addEventListener('load', function () {
        setTimeout(function () { if (!animated) playIn(); }, 400);
      });
    }
  } else {
    window.addEventListener('load', playIn);
    /* Outside OBS: click to preview out/in, double-click to preview the
       fullscreen morph. */
    var clickTimer = null;
    window.addEventListener('click', function () {
      clearTimeout(clickTimer);
      clickTimer = setTimeout(function () {
        if (bar.classList.contains('on')) playOut(); else playIn();
      }, 250);
    });
    window.addEventListener('dblclick', function () {
      clearTimeout(clickTimer);
      switchView(function () { bar.classList.toggle('fs'); });
    });
  }
  /* Ensure a show always clears the out state first. */
  var _origPlayIn = playIn;
  playIn = function () { bar.classList.remove('off'); _origPlayIn(); };

  /* ===== obs-websocket client: lets Companion drive the widget.
     Browser source URL params: ?obspw=PASSWORD (&obsport=4455)
     Companion sends: BroadcastCustomEvent {"eventData":{"eclipseLowerThird":"<cmd>"}}
     Commands: hide · show · showFullscreen · showLower · fullscreen · lower · toggleView
               showReal · hideReal · toggleReal (true-scale inset card) */
  var OBS_PW = q.get('obspw') || '';
  var OBS_PORT = q.get('obsport') || '4455';
  /* ?fs — start directly in the fullscreen layout (dedicated browser source)
     ?noreal — start with the true-scale inset card hidden (still toggleable)
     ?noautoanim — see AUTO_ANIM above: disable auto slide on source visibility */
  if (q.has('fs')) bar.classList.add('fs');
  if (q.has('noreal')) bar.classList.add('noreal');
  /* Preview shortcut (and OBS "Interact"): R toggles the true-scale card */
  window.addEventListener('keydown', function (e) {
    if (e.key === 'r' || e.key === 'R') {
      switchView(function () { bar.classList.toggle('noreal'); });
    }
  });

  /* ===== Companion feedback: push widget state into Companion custom
     variables over its HTTP API. Enable with ?companion=HOST[:PORT]
     (port defaults to 8000, Companion's web/API port). Create these
     custom variables in Companion once; the widget then updates them live
     for button feedbacks and key text ($(custom:eclipse_countdown), …):
       eclipse_view         fullscreen | lower
       eclipse_real         on | off        (true-scale inset card)
       eclipse_visible      on | off        (bar shown on air)
       eclipse_phase        attente | en_cours | max_passe |
                            sous_horizon | terminee
       eclipse_countdown    e.g. 00:13:41 or 2d 05h 42m
       eclipse_obscuration  0.0 – 100.0
     Plus a set of ready-to-read French strings, meant to be dropped straight
     into chat/on-screen text (Twitch status message, button labels, …):
       eclipse_status       e.g. "Éclipse en cours"
       eclipse_next         e.g. "Maximum dans" ("" once it's over)
       eclipse_eta          coarse countdown, e.g. "24 min" / "1 h 03" /
                            "2 j 05 h" ("" once it's over) — changes at most
                            once a minute, unlike eclipse_countdown
       eclipse_pct          current obscuration, e.g. "42,7 %"
       eclipse_sun          e.g. "12,3° au-dessus de l'horizon (OSO)"
       eclipse_pct_max      maximum obscuration, e.g. "96,4 %"      (static)
       eclipse_t_c1/_max/_sunset/_c4  local times, e.g. "19:28"     (static)
     The static ones are re-sent every minute so a Companion restarted
     mid-show picks them back up. */
  var COMP = q.get('companion');
  if (COMP && COMP.indexOf(':') < 0) COMP += ':8000';
  var compLast = {};
  /* force: push even when the value hasn't changed — used to periodically
     re-send the static variables, so a Companion restarted mid-show doesn't
     stay stuck with empty contact times. */
  window.eclipseFeedback = function (name, value, force) {
    if (!COMP || (compLast[name] === value && !force)) return;
    compLast[name] = value;
    fetch('http://' + COMP + '/api/custom-variable/eclipse_' + name +
          '/value?value=' + encodeURIComponent(value),
          { method: 'POST', mode: 'no-cors' }).catch(function () {});
  };
  function pushViewState() {
    eclipseFeedback('view', bar.classList.contains('fs') ? 'fullscreen' : 'lower');
    eclipseFeedback('real', bar.classList.contains('noreal') ? 'off' : 'on');
    eclipseFeedback('visible', bar.classList.contains('on') ? 'on' : 'off');
  }
  new MutationObserver(pushViewState).observe(bar, { attributes: true, attributeFilter: ['class'] });
  pushViewState();
  function b64(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }
  function sha256b64(str) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(b64);
  }
  function connectOBS() {
    var ws;
    try { ws = new WebSocket('ws://127.0.0.1:' + OBS_PORT); } catch (e) { return; }
    ws.onmessage = function (ev) {
      var msg = JSON.parse(ev.data);
      if (msg.op === 0) { /* Hello */
        var ident = { op: 1, d: { rpcVersion: 1, eventSubscriptions: 1 } };
        var auth = msg.d.authentication;
        if (auth) {
          sha256b64(OBS_PW + auth.salt).then(function (secret) {
            return sha256b64(secret + auth.challenge);
          }).then(function (a) {
            ident.d.authentication = a;
            ws.send(JSON.stringify(ident));
          });
        } else {
          ws.send(JSON.stringify(ident));
        }
      } else if (msg.op === 5 && msg.d.eventType === 'CustomEvent') {
        var d = msg.d.eventData || {};
        if (d.eclipseLowerThird === 'hide') playOut();
        /* 'on' means the bar is already revealed: skip re-running the
           entrance animation on a redundant show/showFullscreen. */
        if (d.eclipseLowerThird === 'show' && !bar.classList.contains('on')) playIn();
        /* Reveal straight into the fullscreen layout: off air, 'fs' is set
           before the reveal animation runs, so it never shows the lower-third
           frame and skips the lower-third<->fullscreen morph entirely. On air
           in the lower third, it morphs across like 'fullscreen', so one
           button always lands on "on air, fullscreen" whatever the state. */
        if (d.eclipseLowerThird === 'showFullscreen') {
          if (!bar.classList.contains('on')) {
            bar.classList.add('fs');
            playIn();
          } else if (!bar.classList.contains('fs')) {
            switchView(function () { bar.classList.add('fs'); });
          }
        }
        /* Same for the lower-third layout, mirroring showFullscreen above. */
        if (d.eclipseLowerThird === 'showLower') {
          if (!bar.classList.contains('on')) {
            bar.classList.remove('fs');
            playIn();
          } else if (bar.classList.contains('fs')) {
            switchView(function () { bar.classList.remove('fs'); });
          }
        }
        if (d.eclipseLowerThird === 'fullscreen' && !bar.classList.contains('fs')) {
          switchView(function () { bar.classList.add('fs'); });
        }
        if (d.eclipseLowerThird === 'lower' && bar.classList.contains('fs')) {
          switchView(function () { bar.classList.remove('fs'); });
        }
        if (d.eclipseLowerThird === 'toggleView') {
          switchView(function () { bar.classList.toggle('fs'); });
        }
        /* True-scale inset card on/off (fullscreen only) */
        if (d.eclipseLowerThird === 'showReal') {
          switchView(function () { bar.classList.remove('noreal'); });
        }
        if (d.eclipseLowerThird === 'hideReal') {
          switchView(function () { bar.classList.add('noreal'); });
        }
        if (d.eclipseLowerThird === 'toggleReal') {
          switchView(function () { bar.classList.toggle('noreal'); });
        }
      }
    };
    ws.onclose = function () { setTimeout(connectOBS, 5000); };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }
  connectOBS();
})();
</script>
<script src="astronomy.browser.min.js"></script>
<script>
/* Widget éclipse solaire en direct · Thonac, Dordogne · 12 août 2026 */
(function () {
  'use strict';
  var A = Astronomy;
  // --- URL params ---
  var params = new URLSearchParams(location.search);
  // Defaults to Paris (public, non-identifying); pass ?lat=&lon=&alt= for the actual broadcast site.
  var LAT = parseFloat(params.get('lat') || '48.8566'), LON = parseFloat(params.get('lon') || '2.3522'), ELEV = parseFloat(params.get('alt') || '35');
  var TZ = 'Europe/Paris';
  var observer = new A.Observer(LAT, LON, ELEV);
  var KM_PER_AU = 1.4959787069098932e8;
  var SUN_KM = 695700, MOON_KM = 1737.4;

  var DEMO = params.has('demo');
  var DEMO_SPEED = parseFloat(params.get('speed') || '120');
  var demoAnchorReal = Date.now();

  // --- Compute local circumstances once ---
  var ecl, tC1, tPeak, tC4, tSunset, peakObsc;
  try {
    ecl = A.SearchLocalSolarEclipse(A.MakeTime(new Date('2026-08-01T00:00:00Z')), observer);
    tC1 = ecl.partial_begin.time.date.getTime();
    tPeak = ecl.peak.time.date.getTime();
    tC4 = ecl.partial_end.time.date.getTime();
    peakObsc = ecl.obscuration;
    tSunset = A.SearchRiseSet(A.Body.Sun, observer, -1, A.MakeTime(new Date('2026-08-12T12:00:00Z')), 1).date.getTime();
  } catch (e) {
    // Fallback: precomputed values (UTC) for Thonac
    tC1 = Date.parse('2026-08-12T17:28:46Z');
    tPeak = Date.parse('2026-08-12T18:23:44Z');
    tC4 = Date.parse('2026-08-12T19:15:33Z');
    tSunset = Date.parse('2026-08-12T19:06:48Z');
    peakObsc = 0.964;
  }

  function now() {
    if (!DEMO) return Date.now();
    var elapsed = Date.now() - demoAnchorReal;
    return (tC1 - 3 * 60000) + elapsed * DEMO_SPEED;
  }

  // --- Astronomy helpers ---
  function sunMoon(tms) {
    var t = A.MakeTime(new Date(tms));
    var sEq = A.Equator(A.Body.Sun, t, observer, true, true);
    var mEq = A.Equator(A.Body.Moon, t, observer, true, true);
    var sHz = A.Horizon(t, observer, sEq.ra, sEq.dec, 'normal');
    var mHz = A.Horizon(t, observer, mEq.ra, mEq.dec, 'normal');
    var sepRad = A.AngleBetween(sEq.vec, mEq.vec) * Math.PI / 180;
    var rSun = Math.asin(SUN_KM / (sEq.dist * KM_PER_AU));
    var rMoon = Math.asin(MOON_KM / (mEq.dist * KM_PER_AU));
    return { sHz: sHz, mHz: mHz, sep: sepRad, rSun: rSun, rMoon: rMoon };
  }

  function obscuration(g) {
    var d = g.sep, a = g.rSun, b = g.rMoon;
    if (d >= a + b) return 0;
    if (d <= Math.abs(a - b)) return b >= a ? 1 : (b * b) / (a * a);
    var x = (d * d + a * a - b * b) / (2 * d);
    var y = Math.sqrt(Math.max(0, a * a - x * x));
    var area = a * a * Math.acos(Math.min(1, Math.max(-1, x / a)))
             + b * b * Math.acos(Math.min(1, Math.max(-1, (d - x) / b)))
             - d * y;
    return Math.min(1, Math.max(0, area / (Math.PI * a * a)));
  }

  // --- Formatting ---
  var timeFmt = new Intl.DateTimeFormat('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: TZ });
  var timeFmtShort = new Intl.DateTimeFormat('fr-FR', { hour: '2-digit', minute: '2-digit', timeZone: TZ });
  function fmtT(ms) { return timeFmt.format(new Date(ms)); }
  function fmtTS(ms) { return timeFmtShort.format(new Date(ms)); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function fmtCountdown(ms) {
    if (ms < 0) ms = 0;
    var s = Math.floor(ms / 1000);
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    if (s >= 86400) {
      var d = Math.floor(s / 86400);
      return d + 'd ' + pad(Math.floor((s % 86400) / 3600)) + 'h ' + pad(m) + 'm';
    }
    return pad(h) + ':' + pad(m) + ':' + pad(sec);
  }
  /* Coarse, human-readable countdown for chat/on-screen text: "2 j 05 h",
     "1 h 03", "24 min", "moins d'une minute". Only changes once a minute, so
     a Twitch message built from it doesn't churn every second. */
  function fmtEta(ms) {
    if (ms < 0) ms = 0;
    var m = Math.floor(ms / 60000);
    if (m >= 1440) return Math.floor(m / 1440) + ' j ' + pad(Math.floor((m % 1440) / 60)) + ' h';
    if (m >= 60) return Math.floor(m / 60) + ' h ' + pad(m % 60);
    if (m >= 1) return m + ' min';
    return 'moins d\'une minute';
  }
  function fmtPct(frac) { return (frac * 100).toFixed(1).replace('.', ',') + ' %'; }
  /* The sky chart draws azimuths past 0°/360° (the camera can pan beyond the
     trajectory's own span), so labels get folded back into one turn. */
  function norm360(a) { return ((a % 360) + 360) % 360; }
  function compass(az) {
    var dirs = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSO', 'SO', 'OSO', 'O', 'ONO', 'NO', 'NNO'];
    return dirs[Math.round(az / 22.5) % 16];
  }

  // --- DOM refs ---
  function $(id) { return document.getElementById(id); }
  var elStatus = $('status'), elCd = $('countdown'), elCdLbl = $('cdlabel'),
      elPct = $('pct'), elSunpos = $('sunpos'), elClock = $('clock'),
      elSun = $('sun'), elMoon = $('moon'), elCorona = $('corona'),
      elProg = $('progressFill'), elBar = $('bar');

  // Static contact times row
  $('tC1').textContent = fmtT(tC1);
  $('tMax').textContent = fmtT(tPeak);
  $('tMaxPct').textContent = (peakObsc * 100).toFixed(1).replace('.', ',') + '%';
  $('tSet').textContent = fmtTS(tSunset);
  $('tC4').textContent = fmtTS(tC4);

  // Same circumstances, pushed to Companion as ready-to-read strings. They
  // never change, but are re-sent every minute in case Companion restarts.
  function pushStatics() {
    if (!window.eclipseFeedback) return;
    eclipseFeedback('pct_max', fmtPct(peakObsc), true);
    eclipseFeedback('t_c1', fmtTS(tC1), true);
    eclipseFeedback('t_max', fmtTS(tPeak), true);
    eclipseFeedback('t_sunset', fmtTS(tSunset), true);
    eclipseFeedback('t_c4', fmtTS(tC4), true);
  }
  pushStatics();
  setInterval(pushStatics, 60000);

  // Timeline marker positions (C1 → C4 = 0 → 100%)
  function frac(t) { return (t - tC1) / (tC4 - tC1) * 100; }
  $('mkMax').style.left = frac(tPeak) + '%';
  $('mkSet').style.left = frac(tSunset) + '%';

  // Sun radius in svg units: read from the SVG so the moon geometry always
  // matches the drawn sun, whatever size the shell uses.
  var SUN_PX = parseFloat(elSun.getAttribute('r')) || 40;

  // ===== Fullscreen sky scene: always-accurate Sun & Moon positions.
  // Two chart views, switched automatically:
  //  · "wide"  — before the eclipse evening: the whole current day's sky,
  //    with the eclipse segment highlighted; both discs ride their own
  //    live positions (you can watch the Moon close in on the Sun for days).
  //  · "zoom"  — from 75 min before first contact: the eclipse evening only;
  //    the Moon disc is placed at its true angular offset from the Sun at
  //    the shared oversized disc scale, so it exactly matches the bite.
  // Azimuth → x, altitude → y (the sky, facing the Sun). L/R/T/YB only set the
  // scale (how much sky per unit): where the drawing ends up on screen is the
  // camera's job — it pans the sky so the Sun/Moon pair stays centred in the
  // area the overlay blocks leave free (see safeCenter).
  var skyUpdate = (function () {
    var svg = $('skychart'), wrap = $('skywrap');
    if (!svg || !wrap) return function () {};
    var moonWrap = $('moonwrap'), moonDisc = $('moondisc');
    var W = 1920, H = 1080, L = 90, R = 90, T = 230, YB = 950;
    var ZOOM_VW = 16, WIDE_VW = 5, BOX = 150; // disc sizes: must match the CSS
    // The sky is drawn far past the frame so panning never uncovers an edge.
    var EXT_X = 1400, EXT_Y = 900;
    var tz0 = tC1 - 75 * 60000, tz1 = tC4 + 25 * 60000;
    var dayFmt = new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'long', timeZone: TZ });
    var dateKey = new Intl.DateTimeFormat('fr-FR', { timeZone: TZ });
    var mode = '', builtDay = '', x = null, y = null, chartPts = null;

    /* ===== Camera =====
       Where the Sun/Moon pair is parked on screen: the middle of what the
       overlay blocks leave free. All values are chart units (the 1920x1080
       viewBox) and mirror the fullscreen CSS above:
         · red countdown block  width 46vw, right 0  → free up to 54vw
         · true-scale card      width 21vw, left 0   → hidden with .noreal
         · ticker + timeline    76px + 18px, bottom  → free above that
         · caption + legend     top-left corner      → free below LEG_BOT */
    var PAD = 26, LEG_BOT = 134;
    function safeCenter() {
      var vh = window.innerHeight || H;
      var l = (elBar.classList.contains('noreal') ? 0 : W * 0.21) + PAD;
      var r = W * 0.54 - PAD;
      var t = LEG_BOT + PAD;
      var b = H - 94 * (H / vh) - PAD;
      return { x: (l + r) / 2, y: (t + b) / 2 };
    }
    // Current pan, kept so a chart rebuild re-applies it to the fresh layers.
    var panX = 0, panY = 0;
    function setPan(px, py) {
      panX = px; panY = py;
      var gp = svg.querySelector('#skypan'), ga = svg.querySelector('#skyalt');
      if (gp) gp.style.transform = 'translate(' + px.toFixed(1) + 'px,' + py.toFixed(1) + 'px)';
      if (ga) ga.style.transform = 'translate(0px,' + py.toFixed(1) + 'px)';
    }

    // Sampling window of the wide view: the current day, sunrise → sunset
    function wideWindow(t) {
      try {
        var p = {};
        new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' })
          .formatToParts(new Date(t)).forEach(function (q) { p[q.type] = q.value; });
        var midnight = Date.parse(p.year + '-' + p.month + '-' + p.day + 'T00:00:00+02:00');
        var rise = A.SearchRiseSet(A.Body.Sun, observer, +1, A.MakeTime(new Date(midnight)), 1).date.getTime();
        var set = A.SearchRiseSet(A.Body.Sun, observer, -1, A.MakeTime(new Date(midnight + 43200000)), 1).date.getTime();
        return [rise - 40 * 60000, set + 40 * 60000];
      } catch (e) { return [t - 9 * 3600000, t + 9 * 3600000]; }
    }

    function buildChart(m, t) {
      var ta, tb;
      if (m === 'zoom') { ta = tz0; tb = tz1; }
      else { var ww = wideWindow(t); ta = ww[0]; tb = ww[1]; }
      var step = Math.max(240000, Math.round((tb - ta) / 110));
      var pts = [];
      for (var ts = ta; ts < tb; ts += step) pts.push(sunMoon(ts));
      pts.push(sunMoon(tb));
      chartPts = pts; /* shared with the true-scale inset's trajectory lines */

      var azLo = Infinity, azHi = -Infinity, altLo = Infinity, altHi = -Infinity;
      pts.forEach(function (p) {
        azLo = Math.min(azLo, p.sHz.azimuth, p.mHz.azimuth);
        azHi = Math.max(azHi, p.sHz.azimuth, p.mHz.azimuth);
        altLo = Math.min(altLo, p.sHz.altitude, p.mHz.altitude);
        altHi = Math.max(altHi, p.sHz.altitude, p.mHz.altitude);
      });
      azLo -= 1.5; azHi += 1.5;
      altHi += 3; altLo = Math.min(Math.max(altLo - 2, -12), -3);
      x = function (az) { return L + (az - azLo) / (azHi - azLo) * (W - L - R); };
      y = function (al) { return T + (altHi - al) / (altHi - altLo) * (YB - T); };

      var azAt = function (px) { return azLo + (px - L) / (W - L - R) * (azHi - azLo); };

      var yH = y(0), xA = -EXT_X, xB = W + EXT_X;
      // Three layers: s pans with the sky, sAlt only vertically (altitude
      // labels stay at the left edge), sFix never moves (caption + legend).
      var s = [], sAlt = [], sFix = [];
      // Altitude gridlines: drawn past the frame, since the sky pans under it
      for (var a = 10; a <= Math.min(88, altHi + 40); a += 10) {
        s.push('<line x1="' + xA + '" y1="' + y(a).toFixed(1) + '" x2="' + xB + '" y2="' + y(a).toFixed(1) +
               '" stroke="rgba(255,255,255,0.16)" stroke-width="1" stroke-dasharray="3 7"/>');
        sAlt.push('<text x="' + (L - 12) + '" y="' + (y(a) + 5).toFixed(1) +
               '" text-anchor="end" font-size="16" fill="rgba(255,255,255,0.55)">' + a + '°</text>');
      }
      // Paths first, then the semi-transparent ground on top: whatever dips
      // below the horizon stays visible but dimmed.
      function polyPts(list, body) {
        return list.map(function (p) {
          return x(p[body].azimuth).toFixed(1) + ',' + y(p[body].altitude).toFixed(1);
        }).join(' ');
      }
      s.push('<polyline points="' + polyPts(pts, 'sHz') +
             '" fill="none" stroke="#ffd257" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>');
      s.push('<polyline points="' + polyPts(pts, 'mHz') +
             '" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="3.5" stroke-dasharray="12 10" stroke-linecap="round"/>');
      // The eclipse zone belongs to the eclipse day only: on any other
      // day's chart it is not drawn at all.
      var eclToday = dateKey.format(new Date(t)) === dateKey.format(new Date(tPeak));
      if (m === 'wide' && eclToday) {
        var zone = [];
        for (var tsz = tC1; tsz < tC4; tsz += 300000) zone.push(sunMoon(tsz));
        zone.push(sunMoon(tC4));
        s.push('<polyline points="' + polyPts(zone, 'sHz') +
               '" fill="none" stroke="#e1000f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>');
      }
      s.push('<rect x="' + xA + '" y="' + yH.toFixed(1) + '" width="' + (xB - xA) + '" height="' + (H + 2 * EXT_Y) +
             '" fill="rgba(0,0,0,0.35)"/>');
      s.push('<line x1="' + xA + '" y1="' + yH.toFixed(1) + '" x2="' + xB + '" y2="' + yH.toFixed(1) +
             '" stroke="#fff" stroke-width="3"/>');
      // Contact markers on the Sun's path
      var markers = [
        { t: tC1,     lbl: 'DÉBUT',   above: true,  lift: 0 },
        { t: tPeak,   lbl: 'MAXIMUM', above: true,  lift: 0 },
        { t: tSunset, lbl: 'COUCHER', above: true,  lift: 16 },
        { t: tC4,     lbl: 'FIN',     above: false, lift: 0 }
      ];
      markers.forEach(function (mk) {
        var gk = sunMoon(mk.t);
        mk.x = x(gk.sHz.azimuth); mk.y = y(gk.sHz.altitude);
      });
      // Azimuth ticks under the horizon + compass points in the ground band.
      // The range covers everything the camera can pan into view, not just the
      // trajectory's own span.
      var azStep = (azHi - azLo) > 80 ? 15 : 5;
      var azA = Math.max(azAt(xA), -90), azB = Math.min(azAt(xB), 450);
      for (var az = Math.ceil(azA / azStep) * azStep; az <= azB; az += azStep) {
        s.push('<line x1="' + x(az).toFixed(1) + '" y1="' + yH.toFixed(1) + '" x2="' + x(az).toFixed(1) +
               '" y2="' + (yH + 10).toFixed(1) + '" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>');
        s.push('<text x="' + x(az).toFixed(1) + '" y="' + (yH + 32).toFixed(1) +
               '" text-anchor="middle" font-size="15" fill="rgba(255,255,255,0.55)">' + norm360(az) + '°</text>');
      }
      for (var c = Math.ceil(azA / 22.5); c * 22.5 <= azB; c++) {
        var caz = c * 22.5;
        var cx = x(caz);
        if (m === 'zoom' &&
            markers.some(function (mk) { return !mk.above && Math.abs(mk.x - cx) < 110; })) continue;
        s.push('<text x="' + cx.toFixed(1) + '" y="' + (yH + 68).toFixed(1) +
               '" text-anchor="middle" font-size="24" font-weight="900" fill="rgba(255,255,255,0.85)">' +
               compass(norm360(caz)) + '</text>');
      }
      // Caption + legend: top-left corner, the one part of the canvas neither
      // the overlay blocks nor the discs ever reach. It doesn't pan with the
      // sky, so a halo keeps it readable over whatever slides underneath.
      var capDate = m === 'zoom' ? new Date(tPeak) : new Date(t);
      var halo = ' stroke="#10173a" stroke-width="4" stroke-linejoin="round" paint-order="stroke"';
      sFix.push('<text x="' + L + '" y="84" font-size="18" font-weight="900" letter-spacing="1" ' +
             'fill="rgba(255,255,255,0.9)"' + halo + '>TRAJECTOIRE DANS LE CIEL · ' +
             dayFmt.format(capDate).toUpperCase() + '</text>');
      sFix.push('<line x1="' + L + '" y1="' + (LEG_BOT - 16) + '" x2="' + (L + 40) + '" y2="' + (LEG_BOT - 16) +
             '" stroke="#ffd257" stroke-width="6" stroke-linecap="round"/>');
      sFix.push('<text x="' + (L + 52) + '" y="' + (LEG_BOT - 10) + '" font-size="16" font-weight="700" fill="#fff"' +
             halo + '>SOLEIL</text>');
      sFix.push('<line x1="' + (L + 148) + '" y1="' + (LEG_BOT - 16) + '" x2="' + (L + 188) + '" y2="' + (LEG_BOT - 16) +
             '" stroke="rgba(255,255,255,0.8)" stroke-width="3.5" stroke-dasharray="9 8"/>');
      sFix.push('<text x="' + (L + 200) + '" y="' + (LEG_BOT - 10) + '" font-size="16" font-weight="700" fill="#fff"' +
             halo + '>LUNE</text>');
      if (m === 'zoom') {
        markers.forEach(function (mk) {
          s.push('<circle cx="' + mk.x.toFixed(1) + '" cy="' + mk.y.toFixed(1) +
                 '" r="8" fill="#fff" stroke="rgba(0,0,0,0.35)" stroke-width="2"/>');
          var nameY = mk.above ? mk.y - 44 - mk.lift : mk.y + 30;
          var timeY = mk.above ? mk.y - 22 - mk.lift : mk.y + 52;
          s.push('<text x="' + mk.x.toFixed(1) + '" y="' + nameY.toFixed(1) +
                 '" text-anchor="middle" font-size="20" font-weight="900" fill="#fff">' + mk.lbl + '</text>');
          s.push('<text x="' + mk.x.toFixed(1) + '" y="' + timeY.toFixed(1) +
                 '" text-anchor="middle" font-size="18" fill="rgba(255,255,255,0.8)">' + fmtTS(mk.t) + '</text>');
        });
      } else if (eclToday) {
        // Compact eclipse label above the red segment
        markers.forEach(function (mk) {
          s.push('<circle cx="' + mk.x.toFixed(1) + '" cy="' + mk.y.toFixed(1) +
                 '" r="5" fill="#fff" stroke="rgba(0,0,0,0.35)" stroke-width="1.5"/>');
        });
        var gz = sunMoon((tC1 + tC4) / 2);
        var zx = x(gz.sHz.azimuth), zy = y(gz.sHz.altitude);
        s.push('<text x="' + zx.toFixed(1) + '" y="' + (zy - 56).toFixed(1) +
               '" text-anchor="middle" font-size="20" font-weight="900" fill="#fff">ÉCLIPSE</text>');
        s.push('<text x="' + zx.toFixed(1) + '" y="' + (zy - 34).toFixed(1) +
               '" text-anchor="middle" font-size="17" fill="rgba(255,255,255,0.8)">' +
               fmtTS(tC1) + ' – ' + fmtTS(tC4) + '</text>');
      }
      return '<g id="skypan">' + s.join('') + '</g>' +
             '<g id="skyalt">' + sAlt.join('') + '</g>' +
             '<g id="skyfix">' + sFix.join('') + '</g>';
    }

    function rebuild(m, t) {
      var first = !mode;
      mode = m;
      builtDay = m === 'wide' ? dateKey.format(new Date(t)) : '';
      var html;
      try { html = buildChart(m, t); } catch (e) { return; }
      elBar.classList.toggle('wide', m === 'wide');
      // The fresh layers start where the camera already is, so a rebuild
      // never slides the sky back to the origin first.
      if (first) { svg.innerHTML = html; setPan(panX, panY); return; }
      // Dip-to-rebuild: quick fade while the discs glide to the new scale
      svg.style.transition = 'opacity 0.3s ease';
      svg.style.opacity = 0;
      setTimeout(function () {
        svg.innerHTML = html; setPan(panX, panY); svg.style.opacity = 1;
      }, 320);
    }

    var rvSun = $('rvsun'), rvMoon = $('rvmoon'), rvGlow = $('rvglow'),
        rvGround = $('rvground'), rvHor = $('rvhor'), rvFov = $('rvfov'),
        rvSunPath = $('rvsunpath'), rvMoonPath = $('rvmoonpath');

    // True-scale inset: real apparent sizes, camera centered between the two
    // bodies, field of view auto-zoomed to keep both in frame.
    function updateRealView(g, ob) {
      if (!rvSun || !rvMoon) return;
      var degPerRad = 180 / Math.PI;
      var rS = g.rSun * degPerRad, rM = g.rMoon * degPerRad;
      var sep = g.sep * degPerRad;
      var fov = Math.max(1.7, (sep + 2 * rS) * 1.35);
      var s = 500 / fov;
      var dAzC = g.mHz.azimuth - g.sHz.azimuth;
      if (dAzC > 180) dAzC -= 360; if (dAzC < -180) dAzC += 360;
      var azC = g.sHz.azimuth + dAzC / 2;
      var altC = (g.sHz.altitude + g.mHz.altitude) / 2;
      var cosA = Math.cos(altC * Math.PI / 180);
      function px(az, alt) {
        var da = az - azC;
        if (da > 180) da -= 360; if (da < -180) da += 360;
        return { x: 250 + da * cosA * s, y: 250 - (alt - altC) * s };
      }
      var ps = px(g.sHz.azimuth, g.sHz.altitude);
      var pm = px(g.mHz.azimuth, g.mHz.altitude);
      // Trajectory lines through the moving camera (same samples as the
      // main chart, so both views show the same paths)
      if (chartPts && rvSunPath && rvMoonPath) {
        var sp = '', mp = '';
        for (var i = 0; i < chartPts.length; i++) {
          var a = px(chartPts[i].sHz.azimuth, chartPts[i].sHz.altitude);
          var b = px(chartPts[i].mHz.azimuth, chartPts[i].mHz.altitude);
          sp += a.x.toFixed(0) + ',' + a.y.toFixed(0) + ' ';
          mp += b.x.toFixed(0) + ',' + b.y.toFixed(0) + ' ';
        }
        rvSunPath.setAttribute('points', sp);
        rvMoonPath.setAttribute('points', mp);
      }
      rvSun.setAttribute('cx', ps.x.toFixed(1)); rvSun.setAttribute('cy', ps.y.toFixed(1));
      rvSun.setAttribute('r', (rS * s).toFixed(1));
      rvMoon.setAttribute('cx', pm.x.toFixed(1)); rvMoon.setAttribute('cy', pm.y.toFixed(1));
      rvMoon.setAttribute('r', (rM * s).toFixed(1));
      rvGlow.setAttribute('cx', ps.x.toFixed(1)); rvGlow.setAttribute('cy', ps.y.toFixed(1));
      rvGlow.setAttribute('r', (rS * s * 2.4).toFixed(1));
      rvGlow.setAttribute('opacity', ob > 0.85 ? ((ob - 0.85) / 0.15).toFixed(2) : 0);
      // Real horizon: the ground slides up and occludes the discs at sunset
      var yHor = 250 + altC * s;
      if (yHor > 520) yHor = 620; /* far below the frame: park it */
      rvGround.setAttribute('y', yHor.toFixed(1));
      rvHor.setAttribute('y', (yHor - 1.25).toFixed(1));
      if (rvFov) rvFov.textContent = 'CHAMP ' + fov.toFixed(1).replace('.', ',') + '°';
    }

    return function (t, g, ob) {
      /* Zoom only around the eclipse evening; back to the day chart after */
      var m = (t < tz0 || t > tz1 + 5400000) ? 'wide' : 'zoom';
      if (m !== mode || (m === 'wide' && dateKey.format(new Date(t)) !== builtDay)) rebuild(m, t);
      updateRealView(g, ob || 0);
      if (!x) return;
      // Both discs, in chart units, before the camera moves anything.
      var sx = x(g.sHz.azimuth), sy = y(g.sHz.altitude), mx = sx, my = sy;
      if (moonWrap && moonDisc) {
        moonDisc.setAttribute('r', ((g.rMoon / g.rSun) * SUN_PX).toFixed(2));
        if (m === 'zoom') {
          // True angular offset from the Sun at the shared oversized disc
          // scale — the same math as the bite mask, so the disc always sits
          // exactly over the bite.
          var degPerRad = 180 / Math.PI;
          var pxPerDeg = SUN_PX / (g.rSun * degPerRad);
          var dAz = g.mHz.azimuth - g.sHz.azimuth;
          if (dAz > 180) dAz -= 360; if (dAz < -180) dAz += 360;
          var dx = dAz * Math.cos(g.sHz.altitude * Math.PI / 180) * pxPerDeg;
          var dy = -(g.mHz.altitude - g.sHz.altitude) * pxPerDeg;
          var aspect = (window.innerWidth || W) / (window.innerHeight || H);
          mx = sx + dx / BOX * ZOOM_VW * W / 100;
          my = sy + dy / BOX * ZOOM_VW * aspect * H / 100;
        } else {
          // Own live position on the sky map. The discs are oversized, so
          // keep them from overlapping while the real bodies are still far
          // apart: clamp the Moon to "just touching" along the true bearing.
          var mrx = x(g.mHz.azimuth), mry = y(g.mHz.altitude);
          var ddx = mrx - sx, ddy = mry - sy;
          var d = Math.sqrt(ddx * ddx + ddy * ddy);
          var discU = WIDE_VW / 100 * W;
          var minD = discU * (SUN_PX / BOX) * (1 + g.rMoon / g.rSun) + 4;
          if (d > 0 && d < minD) { ddx *= minD / d; ddy *= minD / d; }
          mx = sx + ddx; my = sy + ddy;
        }
      }
      // Camera: pan the sky so the pair sits in the middle of the free area,
      // instead of wherever on the canvas its sky coordinates happen to fall
      // (under the countdown block, on the legend, behind the ticker…). It
      // stops at the horizon rather than following the Sun underground: once
      // set, the pair sinks below a centred horizon line.
      var c = safeCenter();
      setPan(c.x - (sx + mx) / 2, Math.max(c.y - (sy + my) / 2, c.y - y(0)));
      wrap.style.setProperty('--sunX', ((sx + panX) / W * 100).toFixed(2) + '%');
      wrap.style.setProperty('--sunY', ((sy + panY) / H * 100).toFixed(2) + '%');
      if (!moonWrap || !moonDisc) return;
      moonWrap.style.setProperty('--moonX', ((mx + panX) / W * 100).toFixed(2) + '%');
      moonWrap.style.setProperty('--moonY', ((my + panY) / H * 100).toFixed(2) + '%');
      var malt = g.mHz.altitude;
      moonWrap.style.opacity = malt < 0 ? Math.max(0, 1 + malt / 1.2).toFixed(2) : 1;
    };
  })();

  function updateSlow() {
    var t = now();
    var g = sunMoon(t);
    var ob = obscuration(g);

    // Live percentage
    elPct.textContent = (ob * 100).toFixed(1).replace('.', ',') + '%';
    if (window.eclipseFeedback) {
      eclipseFeedback('obscuration', (ob * 100).toFixed(1));
      eclipseFeedback('pct', fmtPct(ob));
    }

    // Sun position
    var alt = g.sHz.altitude, az = g.sHz.azimuth;
    if (alt > -1.2) {
      elSunpos.textContent = 'SOLEIL  ALT ' + alt.toFixed(1).replace('.', ',') + '° · AZ ' + az.toFixed(0) + '° ' + compass(az);
    } else {
      elSunpos.textContent = 'SOLEIL SOUS L\'HORIZON';
    }
    if (window.eclipseFeedback) {
      eclipseFeedback('sun', alt > -1.2
        ? alt.toFixed(1).replace('.', ',') + '° au-dessus de l\'horizon (' + compass(az) + ')'
        : 'sous l\'horizon');
    }

    // Sun/Moon graphic: offset of moon relative to sun as seen in the sky
    var degPerRad = 180 / Math.PI;
    var rSunDeg = g.rSun * degPerRad;
    var pxPerDeg = SUN_PX / rSunDeg;
    var dAz = g.mHz.azimuth - g.sHz.azimuth;
    if (dAz > 180) dAz -= 360; if (dAz < -180) dAz += 360;
    var dx = dAz * Math.cos(g.sHz.altitude * Math.PI / 180) * pxPerDeg;
    var dy = -(g.mHz.altitude - g.sHz.altitude) * pxPerDeg;
    var rMoonPx = (g.rMoon / g.rSun) * SUN_PX;
    // Moon is a black circle inside a mask: only the "bite" out of the sun is
    // ever visible, so no dark blob can appear against the transparent overlay.
    elMoon.setAttribute('cx', dx.toFixed(2));
    elMoon.setAttribute('cy', dy.toFixed(2));
    elMoon.setAttribute('r', rMoonPx.toFixed(2));

    // Corona / deep-eclipse glow
    elCorona.style.opacity = ob > 0.85 ? ((ob - 0.85) / 0.15).toFixed(2) : 0;
    // Dim ambient bar as eclipse deepens
    elBar.style.setProperty('--deep', ob.toFixed(3));
    // Sunset dimming of the sun disc
    elSun.style.opacity = alt < 0 ? Math.max(0, 1 + alt / 1.2).toFixed(2) : 1;
    // Fullscreen sky scene: keep the discs on their trajectories
    skyUpdate(t, g, ob);
  }

  function updateFast() {
    var t = now();
    elClock.textContent = fmtT(t) + (DEMO ? '  [DEMO ×' + DEMO_SPEED + ']' : '');

    // status/label drive the widget itself (uppercase); hStatus/hNext are the
    // same thing in plain sentence case, for Companion text (Twitch message…).
    var status, label, target, phase, hStatus, hNext;
    if (t < tC1) {
      status = 'L\'ÉCLIPSE COMMENCE BIENTÔT'; phase = 'attente';
      label = 'PREMIER CONTACT DANS'; target = tC1;
      hStatus = 'L\'éclipse commence bientôt'; hNext = 'premier contact dans';
    } else if (t < tPeak) {
      status = 'ÉCLIPSE EN COURS'; phase = 'en_cours';
      label = 'MAXIMUM (' + (peakObsc * 100).toFixed(1).replace('.', ',') + '%) DANS'; target = tPeak;
      hStatus = 'Éclipse en cours'; hNext = 'maximum dans';
    } else if (t < tSunset) {
      status = 'MAXIMUM PASSÉ'; phase = 'max_passe';
      label = 'COUCHER DU SOLEIL DANS'; target = tSunset;
      hStatus = 'Maximum passé'; hNext = 'coucher du Soleil dans';
    } else if (t < tC4) {
      status = 'SOLEIL COUCHÉ · ÉCLIPSE ENCORE EN COURS'; phase = 'sous_horizon';
      label = 'FIN DE L\'ÉCLIPSE (SOUS L\'HORIZON) DANS'; target = tC4;
      hStatus = 'Soleil couché, éclipse encore en cours'; hNext = 'fin de l\'éclipse (sous l\'horizon) dans';
    } else {
      status = 'L\'ÉCLIPSE EST TERMINÉE'; phase = 'terminee';
      label = 'MERCI D\'AVOIR SUIVI'; target = null;
      hStatus = 'L\'éclipse est terminée'; hNext = '';
    }
    elStatus.textContent = status;
    elCdLbl.textContent = label;
    elCd.textContent = target ? fmtCountdown(target - t) : '--:--:--';
    if (window.eclipseFeedback) {
      eclipseFeedback('phase', phase);
      eclipseFeedback('countdown', elCd.textContent);
      eclipseFeedback('status', hStatus);
      eclipseFeedback('next', hNext);
      eclipseFeedback('eta', target ? fmtEta(target - t) : '');
    }

    // Timeline progress
    var p = (t - tC1) / (tC4 - tC1);
    elProg.style.width = (Math.min(1, Math.max(0, p)) * 100).toFixed(2) + '%';
  }

  updateSlow();
  updateFast();
  setInterval(updateFast, 200);
  setInterval(updateSlow, DEMO ? 200 : 1000);
})();

</script>
<script>
/* Auto-fit the headline to one line, in every state and every frame of the
   morph. Keeps "L'ÉCLIPSE COMMENCE BIENTÔT" from reflowing mid-animation. */
(function () {
  var bar = document.getElementById('bar');
  var status = document.getElementById('status');
  var headline = document.getElementById('headline');
  var redband = document.getElementById('redband');
  if (!bar || !status || !headline || !redband) return;

  var MIN = 20, HARD_MAX = 76;
  var probe = document.createElement('span');
  probe.style.cssText = 'position:absolute;left:-9999px;top:0;white-space:nowrap;' +
                        'visibility:hidden;pointer-events:none;';
  document.body.appendChild(probe);

  function fit() {
    var avail = headline.clientWidth - 4;
    if (avail <= 0) return;
    var cs = getComputedStyle(status);
    probe.style.fontFamily = cs.fontFamily;
    probe.style.fontWeight = cs.fontWeight;
    probe.style.letterSpacing = cs.letterSpacing;
    probe.style.textTransform = cs.textTransform;
    probe.style.fontSize = '100px';
    probe.textContent = status.textContent;
    var w100 = probe.offsetWidth || 1;
    /* Cap tracks the red band height, which animates -> no sudden jump. */
    var cap = Math.min(HARD_MAX, redband.clientHeight * 0.5);
    var size = Math.min(cap, (avail / w100) * 100);
    status.style.fontSize = Math.max(MIN, size).toFixed(1) + 'px';
  }

  /* Refit every frame while the layout is morphing. */
  var until = 0, ticking = false;
  function pump() {
    fit();
    if (performance.now() < until) requestAnimationFrame(pump);
    else ticking = false;
  }
  function refitFor(ms) {
    until = performance.now() + ms;
    if (!ticking) { ticking = true; requestAnimationFrame(pump); }
  }

  new MutationObserver(function () { refitFor(1000); })
    .observe(bar, { attributes: true, attributeFilter: ['class'] });
  new MutationObserver(function () { fit(); })
    .observe(status, { childList: true, characterData: true, subtree: true });
  if (window.ResizeObserver) new ResizeObserver(fit).observe(headline);
  window.addEventListener('resize', fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  fit();
})();
</script>
</body>
